name: Разбор Bluetooth и WiFi

on:
  push:
    paths:
      - 'autoanalysis/probe-bt.txt'
  workflow_dispatch:

permissions: { contents: write }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl >/dev/null 2>&1 || true
          mkdir -p reports
      - name: "Скачать прошивку"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl','-L','--fail','--retry','3','--max-time','2500',
                          '-o','/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          cp "$(find /tmp/rar -name system.img | head -1)" /tmp/system.img
          cp "$(find /tmp/rar -name "kernel*.img" | head -1)" /tmp/kernel.img 2>/dev/null || true
          ls -l /tmp/*.img

      - name: "Что есть для Bluetooth"
        run: |
          OUT="$GITHUB_WORKSPACE/reports/bt-wifi.txt"
          exec > "$OUT" 2>&1 || true
          set +e
          echo "# Bluetooth и WiFi в прошивке"
          echo
          echo "## /etc/bluetooth"
          debugfs -R "ls -l /etc/bluetooth" /tmp/system.img 2>&1
          debugfs -R "dump /etc/bluetooth/bt_vendor.conf /tmp/btv.txt" /tmp/system.img 2>&1 | tail -1
          echo "--- содержимое bt_vendor.conf ---"
          cat /tmp/btv.txt 2>/dev/null
          echo
          echo "## библиотеки Bluetooth"
          debugfs -R "ls -l /lib" /tmp/system.img 2>/dev/null | grep -i blue
          echo "## исполняемые файлы BT"
          debugfs -R "ls -l /bin" /tmp/system.img 2>/dev/null | grep -iE "hci|bluetooth|bt_|brcm|patchram"
          echo "## APK Bluetooth"
          debugfs -R "ls -l /app" /tmp/system.img 2>/dev/null | grep -i blue
          debugfs -R "ls -l /priv-app" /tmp/system.img 2>/dev/null | grep -i blue
          echo
          echo "## WiFi: /etc/firmware"
          debugfs -R "ls -l /etc/firmware" /tmp/system.img 2>&1 | head -20
          echo "## WiFi: /etc/wifi"
          debugfs -R "ls -l /etc/wifi" /tmp/system.img 2>&1
          echo "## WiFi: бинарники"
          for f in /bin/wpa_supplicant /bin/hostapd /bin/dhcpcd /bin/ping; do
            echo -n "$f: "
            debugfs -R "stat $f" /tmp/system.img 2>/dev/null | grep -c "Inode:" 
          done
          echo
          echo "## build.prop про bluetooth/wifi/wlan"
          debugfs -R "dump /build.prop /tmp/bp.txt" /tmp/system.img 2>/dev/null
          grep -iE "bluetooth|wifi|wlan|hw\." /tmp/bp.txt || echo "(нет строк)"

      - name: "Драйверы в ядре"
        run: |
          OUT="$GITHUB_WORKSPACE/reports/bt-wifi.txt"
          exec >> "$OUT" 2>&1 || true
          set +e
          echo
          echo "## распаковать ядро"
          K=/tmp/kernel.img
          [ -f "$K" ] || K="$(ls /tmp/rar/*kernel* 2>/dev/null | head -1)"
          echo "файл: $K"
          # ядро лежит сжатым (gzip) — ищем поток и распаковываем
          python3 - <<'PY'
          import gzip, io, re
          data = open([p for p in ['/tmp/kernel.img'] if __import__('os').path.exists(p)][0], 'rb').read() if __import__('os').path.exists('/tmp/kernel.img') else b''
          if not data:
              import glob
              g = glob.glob('/tmp/rar/*kernel*')
              data = open(g[0], 'rb').read() if g else b''
          out = b''
          for m in re.finditer(b'\x1f\x8b\x08', data):
              try:
                  out = gzip.GzipFile(fileobj=io.BytesIO(data[m.start():])).read()
                  break
              except Exception:
                  continue
          print('распаковано:', len(out), 'байт')
          open('/tmp/kernel.bin','wb').write(out)
          PY
          echo
          echo "## драйверы (вхождения в ядре)"
          for d in hci_uart hci_vhci bluetooth btusb wl12xx wlcore wl1271 ftdi_sio ch341 pl2303 cp210x usbserial; do
            n=$(grep -ac "$d" /tmp/kernel.bin 2>/dev/null)
            echo "  $d: ${n:-0}"
          done
          echo
          echo "## контекст USB-серийных"
          grep -aoE "(ftdi_sio|ch341|pl2303|cp210x|usb_serial)[a-z_]*" /tmp/kernel.bin 2>/dev/null | sort | uniq -c | head
          echo
          echo "## контекст bluetooth"
          grep -aoE "hci_[a-z_]+|bt_[a-z_]+|blue[a-z_]*" /tmp/kernel.bin 2>/dev/null | sort | uniq -c | head -12

      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports
          git diff --cached --quiet && exit 0
          git commit -m "проба: bluetooth и wifi"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
