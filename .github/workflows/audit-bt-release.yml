name: Static Bluetooth audit of published release

on:
  push:
    paths:
      - '.github/workflows/audit-bt-release.yml'
      - 'tools/audit_bt_release_asset.sh'
      - 'tools/inspect_elead_spp_api.py'
      - 'autoanalysis/probe-release-bt.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install extraction and Python tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs unzip binutils python3-venv
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet androguard==4.1.4

      - name: Download the selected release asset on the GitHub runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bt-audit"
          gh release download file-manager-test-20261105 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern lifan-file-manager-test.zip \
            --dir "$RUNNER_TEMP/bt-audit"

      - name: Audit image identity and Bluetooth components
        run: |
          bash tools/audit_bt_release_asset.sh \
            "$RUNNER_TEMP/bt-audit/lifan-file-manager-test.zip" \
            reports/bt-release-static-audit.txt

      - name: Inspect Elead SPP AIDL and service metadata
        run: |
          "$RUNNER_TEMP/venv/bin/python" tools/inspect_elead_spp_api.py \
            "$RUNNER_TEMP/bt-audit/lifan-file-manager-test.zip" \
            reports/elead-spp-api-static.txt

      - name: Commit text reports to this branch only
        if: always()
        run: |
          files=()
          [[ -s reports/bt-release-static-audit.txt ]] && files+=(reports/bt-release-static-audit.txt)
          [[ -s reports/elead-spp-api-static.txt ]] && files+=(reports/elead-spp-api-static.txt)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo 'No report was produced; no commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git diff --cached --quiet && exit 0
          git commit -m 'report: inspect Elead Bluetooth SPP API'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" >/dev/null 2>&1 && \
               git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 10
            git rebase --abort >/dev/null 2>&1 || true
          done
          echo 'Unable to push text reports to the triggering branch.' >&2
          exit 1
