name: Достать Яндекс Навигатор 6.40

on:
  push:
    paths:
      - 'autoanalysis/fetch-yandex.txt'
  workflow_dispatch:

permissions: { contents: write }

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq unzip >/dev/null 2>&1 || true
          mkdir -p firmware/apks reports
          SDK=/usr/local/lib/android/sdk
          echo "BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: "Скачать с apkmirror"
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0 Safari/537.36"
          # страница загрузки нужной версии (arm-v7a, API 19)
          PAGE="https://www.apkmirror.com/apk/yandex/yandex-navigator/yandex-navigator-6-40-release/"
          echo "=== страница: $PAGE" | tee reports/yandex-fetch.txt
          curl -s -A "$UA" -L --max-time 60 "$PAGE" -o /tmp/page.html
          echo "размер страницы: $(stat -c%s /tmp/page.html)" | tee -a reports/yandex-fetch.txt
          grep -oE 'href="[^"]*download[^"]*"' /tmp/page.html | head -5 | tee -a reports/yandex-fetch.txt
          # ищем ссылку на вариант armeabi-v7a
          LINK=$(grep -oE '"/apk/yandex/yandex-navigator/[^"]*armeabi[^"]*"' /tmp/page.html | head -1 | tr -d '"')
          echo "ссылка на вариант: $LINK" | tee -a reports/yandex-fetch.txt
          if [ -n "$LINK" ]; then
            curl -s -A "$UA" -L --max-time 60 "https://www.apkmirror.com$LINK" -o /tmp/dl.html
            grep -oE 'key=[a-zA-Z0-9]+' /tmp/dl.html | head -3 | tee -a reports/yandex-fetch.txt
          fi

      - name: "Скачать с f-droid зеркал и архивов"
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/121.0 Safari/537.36"
          for url in \
            "https://yandex-navigator.ru.uptodown.com/android/download" \
            "https://yandex-navigator.en.uptodown.com/android/versions" ; do
            echo "=== $url" | tee -a reports/yandex-fetch.txt
            code=$(curl -s -A "$UA" -L --max-time 60 -o /tmp/p.bin -w '%{http_code}' "$url")
            echo "  код $code, размер $(stat -c%s /tmp/p.bin)" | tee -a reports/yandex-fetch.txt
          done

      - name: "Итог"
        if: always()
        run: |
          {
            echo
            echo "## что получилось"
            ls -l firmware/apks/ 2>/dev/null
          } | tee -a reports/yandex-fetch.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports firmware/apks
          git diff --cached --quiet && exit 0
          git commit -m "яндекс навигатор: попытка скачивания"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
