name: Модель штатного mke2fs на занятом образе
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/experiment-stock-mke2fs-mounted.yml'
      - 'tools/experiment_stock_mke2fs_mounted.sh'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Проверить сценарий
        run: bash -n tools/experiment_stock_mke2fs_mounted.sh
      - name: Изолированный одноразовый образ в CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/experiment_stock_mke2fs_mounted.sh
      - name: Сохранить диагностику
        if: failure()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/stock-mke2fs-mounted.log" || exit 0
          mkdir -p reports
          cp "$RUNNER_TEMP/stock-mke2fs-mounted.log" reports/stock-mke2fs-mounted-lab-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stock-mke2fs-mounted-lab-error.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: diagnose mounted mke2fs synthetic lab'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Сохранить текстовый отчёт
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stock-mke2fs-mounted-lab.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: stock formatter mounted synthetic loop'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
