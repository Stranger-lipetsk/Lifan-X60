name: Отладка патча

on:
  push:
    paths:
      - 'autoanalysis/probe-debug.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl >/dev/null 2>&1 || true
          mkdir -p probes
          curl -sSL --retry 3 --max-time 300 -o /tmp/baksmali.jar \
            https://github.com/baksmali/smali/releases/download/v2.5.2/baksmali-2.5.2.jar
      - name: "Скачать"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl', '-L', '--fail', '--retry', '3', '--max-time', '2500',
                          '-o', '/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          SYSIMG="$(find /tmp/rar -name system.img | head -1)"
          debugfs -R "dump /priv-app/EL830LF01_Home.apk /tmp/Home.apk" "$SYSIMG" 2>&1 | tail -1
          mkdir -p /tmp/home && cd /tmp/home && unzip -o -q /tmp/Home.apk
          java -jar /tmp/baksmali.jar d classes.dex -o smali 2>&1 | tail -2
      - name: "Отладка"
        run: |
          OUT="${GITHUB_WORKSPACE}/probes/debug-patch.txt"
          {
            echo "# Отладка патча"
            echo
            echo "## 1. Какой baksmali ищет '.method private loadEleadApplications()V'"
            grep -n "\.method.*loadEleadApplications" /tmp/home/smali/tw/com/elead/el830/home/HomeApp.smali
            echo
            echo "## 2. Какие .method есть вообще (первые 30)"
            grep -n "^\.method" /tmp/home/smali/tw/com/elead/el830/home/HomeApp.smali | head -30
            echo
            echo "## 3. Что видит awk для этого метода"
            awk '/^\.method private loadEleadApplications/,/^\.end method/' \
              /tmp/home/smali/tw/com/elead/el830/home/HomeApp.smali | wc -l
            echo
            echo "## 4. Поиск cond_23e внутри метода через python"
            python3 - <<'PY'
            import re
            t = open('/tmp/home/smali/tw/com/elead/el830/home/HomeApp.smali').read()
            m = re.search(r'\.method private loadEleadApplications\(\)V.*?\n\.end method', t, re.S)
            print('метод найден:', bool(m))
            if m:
                body = m.group(0)
                print('длина метода:', len(body))
                mm = re.search(r'^\s*:cond_23e\s*$', body, re.M)
                print('cond_23e найден:', bool(mm), 'позиция:', mm.start() if mm else None)
                if mm:
                    print('--- 500 символов до метки ---')
                    print(body[max(0, mm.start()-400):mm.start()])
                    print('--- 500 символов после метки ---')
                    print(body[mm.end():mm.end()+500])
                    print('--- put() после метки ---')
                    tail = body[mm.end():]
                    mp = re.search(r'invoke-virtual \{[^}]*\}, Ljava/util/HashMap;->put', tail)
                    print('put найден:', bool(mp), mp.start() if mp else None)
            PY
          } > "$OUT" 2>&1 || true
          cat "$OUT"
      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probes
          git diff --cached --quiet && exit 0
          git commit -m "проба: отладка патча"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
