name: Сравнение дилерских прошивок и версии энтузиаста

on:
  push:
    paths:
      - '.github/workflows/compare-dealer-2021.yml'
      - 'tools/compare_firmware_releases.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Подготовить инструменты
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar p7zip-full e2fsprogs cpio file
          mkdir -p "$RUNNER_TEMP/compare" reports
      - name: Скачать и распаковать архивы
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/compare"
          mkdir -p "$root/downloads/dealer" "$root/downloads/dealer-time" "$root/downloads/enthusiast"
          gh release download 'прошивка_от_дилера' -p lifan.rar -D "$root/downloads/dealer"
          gh release download 'прошивка_от_дилера_с_исправленным_часовым_поясом' -p 831_lf01_20170309_time_russia.rar -D "$root/downloads/dealer-time"
          gh release download stock -p x60_2021.7z -D "$root/downloads/enthusiast"
          {
            echo '# Проверка исходных архивов'
            find "$root/downloads" -type f -exec sha256sum {} \;
          } > reports/compare-dealer-downloads.txt
          cat reports/compare-dealer-downloads.txt
          for label in dealer dealer-time enthusiast; do
            archive=$(find "$root/downloads/$label" -type f -print -quit)
            test -n "$archive"
            mkdir -p "$root/$label"
            if [ "$label" = enthusiast ]; then
              7z x -y "$archive" -o"$root/$label" > "$root/$label-7z.log" 2>&1
            else
              unar -q -f -D -o "$root/$label" "$archive" > "$root/$label-7z.log" 2>&1
            fi
            echo "Распакован $label"
          done
      - name: Прочитать системные образы без изменения
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/compare"
          for label in dealer dealer-time enthusiast; do
            mapfile -d '' imgs < <(find "$root/$label" -type f -iname system.img -print0)
            if [ "${#imgs[@]}" -ne 1 ]; then
              echo "Ожидался один system.img в $label, найдено ${#imgs[@]}"; find "$root/$label" -type f; exit 1
            fi
            img="${imgs[0]}"
            echo "== $label =="
            file "$img"
            mkdir -p "$root/$label-system"
            debugfs -R "rdump / $root/$label-system" "$img" > "$root/$label-debugfs.log" 2>&1
            test -s "$root/$label-system/build.prop"
            test -d "$root/$label-system/priv-app"
            if grep -iE 'no space left|input/output error|filesystem not open|failed to open|ext2.* error' "$root/$label-debugfs.log"; then
              echo "Ошибка чтения system.img"; exit 1
            fi
            find "$root/$label-system" -type d -exec chmod u+rwx {} +
            find "$root/$label-system" -type f -exec chmod u+r {} +
          done
      - name: Сопоставить именно радио-драйверы и запуск
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/compare"
          {
            echo '# Точные radio-компоненты в исходных системных образах'
            echo 'Все чтения через debugfs; бинарные калибровочные данные в отчёт не копируются.'
            for label in dealer dealer-time enthusiast; do
              img=$(find "$root/$label" -type f -name system.img -print -quit)
              echo "## $label — system SHA-256 $(sha256sum "$img" | cut -d' ' -f1)"
              for path in /etc/wifi /etc/wifi/wlconf /etc/bluetooth /etc/firmware /vendor/firmware /vendor/firmware/ti-connectivity /lib/modules /lib/hw /vendor/lib; do
                echo "### $path"
                debugfs -R "ls -l $path" "$img" 2>&1 || true
              done
              for path in /etc/bluetooth/bt_vendor.conf /etc/firmware/bcm20710a1.hcd /vendor/firmware/fw_bcm40181a2.bin /vendor/firmware/fw_bcm40181a2_apsta.bin /vendor/firmware/fw_bcm40181a2_p2p.bin /vendor/firmware/ti-connectivity/wl18xx-fw-4.bin /vendor/firmware/ti-connectivity/wl18xx-conf.bin /system/bin/el_wifi_enable.sh /system/bin/wifi/rc.wifi /lib/libbluelet.so /bin/blueletd /lib/hw/bluetooth.default.so /vendor/lib/libbt-vendor.so; do
                target="$root/$label-radio-$(echo "$path" | tr '/' '_')"
                if debugfs -R "dump $path $target" "$img" >/dev/null 2>&1 && [ -s "$target" ]; then
                  printf '%s ' "$path"; sha256sum "$target" | cut -d' ' -f1
                else
                  rm -f "$target"; printf '%s MISSING\n' "$path"
                fi
              done
            done
          } > reports/compare-radio-components.txt
          cat reports/compare-radio-components.txt
      - name: Сравнить содержимое и приложения
        run: |
          set -euo pipefail
          bt=$(find /usr/local/lib/android/sdk/build-tools -type f -name aapt | sort -V | tail -1)
          signer="$(dirname "$bt")/apksigner"
          test -x "$bt" && test -x "$signer"
          python3 tools/compare_firmware_releases.py "$RUNNER_TEMP/compare" "$bt" "$signer" \
            > reports/compare-dealer-2021.txt
          wc -c reports/compare-dealer-2021.txt
          head -100 reports/compare-dealer-2021.txt
      - name: Сохранить текстовые отчёты
        if: always()
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for log in "$RUNNER_TEMP"/compare/*-7z.log; do
            [ -f "$log" ] || continue
            printf '\n## %s\n' "$(basename "$log")" >> reports/compare-dealer-downloads.txt
            tail -35 "$log" >> reports/compare-dealer-downloads.txt
          done
          for f in reports/compare-dealer-downloads.txt reports/compare-dealer-2021.txt reports/compare-radio-components.txt; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m 'report: compare dealer and enthusiast firmware'
          for try in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
