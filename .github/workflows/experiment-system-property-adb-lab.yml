name: Свойства системного UID — только эмулятор
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить ограничения стенда
        run: |
          bash -n tools/experiment_system_property_adb_lab.sh
          python3 -m unittest discover -s tests -p 'test_system_property_adb_lab.py' -v
      - name: Только изолированный виртуальный Android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/experiment_system_property_adb_lab.sh
      - name: Сохранить диагностику при ошибке
        if: failure()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/system-prop-lab.log" || exit 0
          mkdir -p reports
          tr -d '\r' < "$RUNNER_TEMP/system-prop-lab.log" > reports/system-property-adb-lab-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/system-property-adb-lab-error.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: diagnose isolated property lab'
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}" || { git rebase --abort || true; sleep 2; continue; }
            git push origin HEAD:"${{ github.ref_name }}" && exit 0
            sleep 2
          done
          exit 1
      - name: Сохранить текстовый отчёт
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/system-property-adb-lab.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: isolated system property lab'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
