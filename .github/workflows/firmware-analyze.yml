name: Облачный анализ прошивки

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: 'Публичная ссылка Яндекс.Диска'
        required: true
        default: 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
      extract_limit_mb:
        description: 'Лимит размера файла для распаковки (МБ, 0 = не ограничивать)'
        required: false
        default: '900'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Установка инструментов анализа
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binwalk unrar-free p7zip-full file cpio gzip xz-utils lz4 python3-pip liblzma-dev >/dev/null 2>&1 || \
          sudo apt-get install -y -qq binwalk unrar p7zip-full file cpio gzip xz-utils | tail -5
          echo "--- tools ---"
          for t in binwalk 7z 7za unrar unrar-free unzip file cpio; do
            printf '%-12s ' "$t"; command -v $t || echo "НЕТ"
          done

      - name: Получение метаданных Яндекс.Диска
        env:
          PUBLIC_KEY: ${{ github.event.inputs.public_key }}
        run: |
          mkdir -p reports
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          pk = os.environ['PUBLIC_KEY']
          url = 'https://cloud-api.yandex.net/v1/disk/public/resources' \
                '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100'
          with urllib.request.urlopen(url, timeout=60) as r:
              data = json.load(r)
          items = data.get('_embedded', {}).get('items', [])
          manifest = []
          for it in items:
              manifest.append({
                  'name': it.get('name'),
                  'size': it.get('size'),
                  'sha256': it.get('sha256'),
                  'md5': it.get('md5'),
                  'type': it.get('type'),
                  'download': (it.get('file') or ''),
              })
          with open('reports/01-yandex-manifest.json', 'w') as f:
              json.dump({'items': manifest}, f, indent=2, ensure_ascii=False)
          # сохраняем только ссылки на скачивание в отдельный файл для шага загрузки
          with open('/tmp/dl.json', 'w') as f:
              json.dump([{'name': m['name'], 'size': m['size'], 'download': m['download']}
                         for m in manifest if m['type'] == 'file'], f, ensure_ascii=False)
          for m in manifest:
              print(f"{m['name']} | {m['size']} | {m['sha256']}")
          PY

      - name: Скачивание и анализ каждого архива
        env:
          LIMIT_MB: ${{ github.event.inputs.extract_limit_mb }}
        run: |
          set -o pipefail
          mkdir -p firmware/original
          python3 - <<'PY'
          import json
          items = json.load(open('/tmp/dl.json'))
          print(len(items), 'файлов к загрузке')
          PY

      - name: Загрузка файлов по прямым ссылкам
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          items = json.load(open('/tmp/dl.json'))
          for it in items:
              dest = os.path.join('firmware/original', it['name'])
              print(f"=== Скачивание {it['name']} ({it['size']} байт) ===", flush=True)
              cmd = ['curl', '-L', '--fail', '--retry', '3', '--retry-delay', '5',
                     '--connect-timeout', '30', '--max-time', '3000',
                     '-o', dest, it['download']]
              r = subprocess.run(cmd)
              if r.returncode != 0:
                  print(f"!! не удалось скачать {it['name']} (код {r.returncode})", flush=True)
                  continue
              sz = os.path.getsize(dest)
              print(f"OK: {dest} = {sz} байт", flush=True)
          PY
          ls -lh firmware/original/

      - name: Анализ архивов (binwalk, 7z, strings, build.prop)
        run: |
          set -x
          mkdir -p reports/unpacked
          for f in firmware/original/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            rep="reports/анализ-$base.txt"
            {
              echo "=== $base ==="
              ls -l "$f"
              sha256sum "$f"
              file "$f"
              echo "--- 7z l ---"
              7z l "$f" 2>&1 | head -300
              echo "--- binwalk ---"
              binwalk "$f" 2>&1 | head -200
              echo "--- строки (маркеры SoC/Android) ---"
              strings -n 6 "$f" | grep -i -E 'android|rk3[0-9]|px[3-6]|allwinner|sunxi|mt65|mt67|mt8|mediatek|msm8|board|linux version|build\.prop|sdk=|ro\.product' | head -200
            } > "$rep" 2>&1
            echo "готово: $rep"
          done
          ls -la reports/

      - name: Распаковка архивов
        run: |
          cd reports/unpacked
          for f in ../../firmware/original/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.rar|*.zip|*.7z) 7z x -y "$f" >/dev/null 2>&1 || echo "не удалось распаковать $f" ;;
            esac
          done
          find . -maxdepth 4 | head -300
          du -sh .

      - name: Разбор Android-образов (build.prop, boot.img)
        run: |
          echo "=== Поиск build.prop ==="
          find reports/unpacked -name 'build.prop' -o -name 'default.prop' -o -name '*.prop' | head -50
          mkdir -p reports/props
          find reports/unpacked -name '*.prop' | while read p; do
            out="reports/props/$(echo "$p" | tr '/' '_')"
            cp "$p" "$out"
          done
          echo "=== Крупные файлы ==="
          find reports/unpacked -type f -size +1M -exec ls -lh {} \; | head -50

      - name: Публикация отчётов в репозиторий
        run: |
          git config user.name "arena-firmware-bot"
          git config user.email "bot@users.noreply.github.com"
          # большие образы не коммитим
          printf 'reports/unpacked/\nfirmware/\n' > .git/info/exclude
          git add -f reports .github 2>/dev/null || true
          git add -A reports 2>/dev/null || true
          git commit -m "отчёты облачного анализа прошивки" || echo "нечего коммитить"
          git push origin HEAD:${{ github.ref_name }} || echo "push не удался"

      - name: Сохранить артефакт (если push не сработал)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-reports
          path: reports/
          retention-days: 7
