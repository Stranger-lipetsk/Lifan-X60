name: Анализ прошивки (облако)

# Запускается автоматически при пуше, а также вручную.
# Скачивает архивы прошивки с Яндекс.Диска, распаковывает и кладёт
# текстовые отчёты обратно в репозиторий (папка reports/).

on:
  push:
    paths:
      - 'autoanalysis/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PUBLIC_KEY: https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg
  # распаковываем только то, что укладывается в лимит (МБ) — git-диффы не раздуваем
  EXTRACT_LIMIT_MB: '700'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Инструменты
        run: |
          sudo apt-get update -qq 2>/dev/null
          sudo apt-get install -y -qq binwalk p7zip-full unrar-free file cpio 2>/dev/null || \
            sudo apt-get install -y -qq binwalk p7zip-full unrar file cpio
          for t in binwalk 7z unrar unrar-free; do printf '%-12s ' "$t"; command -v $t || echo НЕТ; done

      - name: Метаданные Яндекс.Диска
        run: |
          mkdir -p reports firmware/original
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          pk = os.environ['PUBLIC_KEY']
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          with urllib.request.urlopen(url, timeout=60) as r:
              data = json.load(r)
          items = data.get('_embedded', {}).get('items', [])
          out = []
          for it in items:
              out.append({k: it.get(k) for k in ('name', 'size', 'sha256', 'md5', 'type')} | {'download': it.get('file', '')})
          json.dump(out, open('/tmp/dl.json', 'w'), ensure_ascii=False)
          json.dump([{k: v for k, v in i.items() if k != 'download'} for i in out],
                    open('reports/01-манифест-яндекс-диск.json', 'w'), indent=2, ensure_ascii=False)
          for i in out:
              print(i['name'], i['size'], i['sha256'])
          PY

      - name: Скачивание архивов
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          for it in json.load(open('/tmp/dl.json')):
              dest = os.path.join('firmware/original', it['name'])
              print(f"=== {it['name']} ({it['size']} Б) ===", flush=True)
              r = subprocess.run(['curl', '-L', '--fail', '--retry', '3', '--retry-delay', '5',
                                  '--connect-timeout', '30', '--max-time', '2500',
                                  '-o', dest, it['download']])
              if r.returncode:
                  print('!! ошибка скачивания', r.returncode, flush=True)
              else:
                  print('OK', os.path.getsize(dest), 'байт', flush=True)
          PY
          ls -lh firmware/original/

      - name: Быстрый анализ архивов
        run: |
          mkdir -p reports
          for f in firmware/original/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            rep="reports/02-анализ-$base.txt"
            {
              echo "=== $base ==="; ls -l "$f"; sha256sum "$f"; file "$f"
              echo; echo "--- 7z l ---"; 7z l "$f" 2>&1 | head -400
              echo; echo "--- binwalk ---"; binwalk "$f" 2>&1 | head -200
              echo; echo "--- строки: маркеры платформы ---"
              strings -n 6 "$f" | grep -i -E 'android|rk3[0-9]|px[3-6]|allwinner|sunxi|mt[0-9]{4}|mediatek|msm[0-9]|linux version|build\.prop|ro\.product|sdk=' | head -300
            } > "$rep" 2>&1
            echo "готов $rep"
          done

      - name: Распаковка (с лимитом на файл)
        run: |
          set -x
          mkdir -p reports/unpacked
          cd reports/unpacked
          for f in ../../firmware/original/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.rar|*.zip|*.7z) 7z x -y -aos "$f" >/dev/null 2>&1 || echo "!! распаковка не удалась: $f" ;;
            esac
          done
          # убираем слишком большие образы, чтобы не тащить их в git
          find . -type f -size +${EXTRACT_LIMIT_MB}M -print -delete | head -50
          du -sh .
          find . -maxdepth 3 | head -200

      - name: Разбор образов Android
        run: |
          {
            echo "=== Все .prop файлы ==="
            find reports/unpacked -name '*.prop' -printf '%s\t%p\n' | sort -rn | head -50
            echo; echo "=== Файлы крупнее 1 МБ ==="
            find reports/unpacked -type f -size +1M -printf '%s\t%p\n' | sort -rn | head -80
            echo; echo "=== Сами build.prop (первые 200 строк) ==="
            find reports/unpacked -name 'build.prop' | while read p; do
              echo "----- $p -----"; head -200 "$p"
            done
          } > reports/03-разбор-образов.txt 2>&1
          cat reports/03-разбор-образов.txt | head -100

      - name: Коммит результатов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'firmware/\nreports/unpacked/\n' > .git/info/exclude
          git add -A reports
          if git diff --cached --quiet; then echo "нет изменений"; else
            git commit -m "отчёты анализа прошивки (облако)"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-reports
          path: reports/
          retention-days: 7
