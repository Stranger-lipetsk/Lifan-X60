name: Чтение места и монтирования только в эмуляторе
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/experiment-storage-readonly-lab.yml'
      - 'tools/experiment_storage_readonly_lab.sh'
      - 'tools/validate_storage_probe_ui.py'
      - 'tools/validate_storage_sysfs_lab.py'
      - 'tests/test_validate_storage_sysfs_lab.py'
      - 'tests/test_validate_storage_probe_ui.py'
      - 'tests/test_storage_readonly_lab_fixture.py'
      - 'tests/fixtures/storage-readonly-lab/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить ограничения и разбор показаний
        run: |
          bash -n tools/experiment_storage_readonly_lab.sh
          python3 -m unittest discover -s tests -p 'test_validate_storage_probe_ui.py' -v
          python3 -m unittest discover -s tests -p 'test_validate_storage_sysfs_lab.py' -v
          python3 -m unittest discover -s tests -p 'test_storage_readonly_lab_fixture.py' -v
      - name: Проверить в одноразовом эмуляторе
        timeout-minutes: 22
        run: bash tools/experiment_storage_readonly_lab.sh
      - name: Сохранить диагностику при ошибке
        if: failure()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/storage-readonly-x86-lab.log" || exit 0
          mkdir -p reports
          tr -d '\r' < "$RUNNER_TEMP/storage-readonly-x86-lab.log" > reports/storage-readonly-lab-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/storage-readonly-lab-error.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: diagnose storage probe lab'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Сохранить только текстовый отчёт
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/storage-readonly-x86-lab.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: read-only storage probe lab'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
