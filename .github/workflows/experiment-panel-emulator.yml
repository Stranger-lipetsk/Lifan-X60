name: Панель и Launcher2 в изолированном эмуляторе
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/experiment-panel-emulator.yml'
      - 'tools/experiment_panel_emulator.sh'
      - 'launcher-panel-integrated/**'
      - 'tests/test_integrated_launcher_panel.py'
      - 'tests/fixtures/launcher-home/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить код панели и патчер manifest
        run: |
          python3 -m unittest discover -s tests -p 'test_integrated_launcher_panel.py' -v
          python3 -m unittest discover -s tests -p 'test_experiment_launcher_manifest.py' -v
          bash -n tools/experiment_panel_emulator.sh
      - name: Проверить на чистом эмуляторе, не на ГУ
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/experiment_panel_emulator.sh
      - name: Сохранить диагностику при ошибке эксперимента
        if: failure()
        run: |
          set -e
          test -s "$RUNNER_TEMP/panel-emulator.log" || exit 0
          mkdir -p reports
          tr -d '\r' < "$RUNNER_TEMP/panel-emulator.log" > reports/panel-launcher-emulator-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/panel-launcher-emulator-error.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: diagnose panel and launcher emulator experiment'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Сохранить только текстовый отчёт
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/panel-launcher-emulator-laboratory.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: panel and launcher emulator test'
          for try in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
