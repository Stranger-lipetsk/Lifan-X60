name: Проверка пересборки оболочки

on:
  push:
    paths:
      - 'autoanalysis/probe-decomp.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl openssl >/dev/null 2>&1 || true
          mkdir -p probes
          curl -sSL --retry 3 --max-time 300 -o /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          curl -sSL --retry 3 --max-time 300 -o /tmp/baksmali.jar \
            https://github.com/baksmali/smali/releases/download/v2.5.2/baksmali-2.5.2.jar
          curl -sSL --retry 3 --max-time 300 -o /tmp/smali.jar \
            https://github.com/baksmali/smali/releases/download/v2.5.2/smali-2.5.2.jar
          ls -l /tmp/*.jar
          Java=$(which java) && echo "java: $Java"

      - name: "Скачать прошивку"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl', '-L', '--fail', '--retry', '3', '--max-time', '2500',
                          '-o', '/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          find /tmp/rar -name system.img | head -1

      - name: "Пересборка оболочки через apktool"
        run: |
          SYSIMG="$(find /tmp/rar -name system.img | head -1)"
          OUT="${GITHUB_WORKSPACE}/probes/decomp-report.txt"
          {
            echo "# Можно ли пересобрать EL830LF01_Home.apk"
            echo
            debugfs -R "dump /priv-app/EL830LF01_Home.apk /tmp/Home.apk" "$SYSIMG" 2>&1 | tail -1
            ls -l /tmp/Home.apk
            echo
            echo "## подпись оригинала"
            keytool -printcert -jarfile /tmp/Home.apk 2>&1 | head -12
            echo
            echo "## apktool: распаковка"
            java -jar /tmp/apktool.jar d -f /tmp/Home.apk -o /tmp/HomeDec 2>&1 | tail -8
            echo
            echo "## что внутри после распаковки"
            ls /tmp/HomeDec 2>/dev/null | head
            echo
            echo "## apktool: сборка обратно (без изменений)"
            java -jar /tmp/apktool.jar b /tmp/HomeDec -o /tmp/HomeRebuilt.apk 2>&1 | tail -20
            ls -l /tmp/HomeRebuilt.apk 2>/dev/null
            echo
            echo "## размеры: оригинал / пересобранный"
            stat -c '%n %s' /tmp/Home.apk /tmp/HomeRebuilt.apk 2>/dev/null
          } > "$OUT" 2>&1 || true
          cat "$OUT"

      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probes
          if git diff --cached --quiet; then echo "нет изменений"; exit 0; fi
          git commit -m "проба: пересборка оболочки apktool"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
