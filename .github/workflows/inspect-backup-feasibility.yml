name: Исследование штатного резервного копирования
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/inspect-backup-feasibility.yml'
      - 'tools/inspect_backup_feasibility.py'
      - 'tests/test_inspect_backup_feasibility.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить анализатор
        run: python3 -m unittest discover -s tests -p 'test_inspect_backup_feasibility.py' -v
      - name: Получить файлы из проверенного образа
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs unzip
          w="$RUNNER_TEMP/backup-study"
          mkdir -p "$w" reports
          gh release download file-manager-test-20261105 -p lifan-file-manager-test.zip -D "$w"
          echo "4be81211994221e80e401ce712ce484b5320156902fff3707737b73e3945d17f  $w/lifan-file-manager-test.zip" | sha256sum -c -
          unzip -p "$w/lifan-file-manager-test.zip" system.img > "$w/system.img"
          echo "a660f062716fd42d5a6185faec059f42675b3024304de7b81fac5d705cc88511  $w/system.img" | sha256sum -c -
          for spec in 'priv-app/Navitel-large.apk:old.apk' 'app/AmazeFileManager.apk:amaze.apk' 'framework/services.jar:services.jar' 'app/Bluetooth.apk:manifest.apk'; do
            src=${spec%%:*}; dst=${spec#*:}
            debugfs -R "dump /$src $w/$dst" "$w/system.img" >/dev/null 2>&1
            test -s "$w/$dst"
          done
          echo "6e216ab39aacaafacda1ebb09f6edc8726e4d1eb6b4985256ccd18aeb5046c44  $w/old.apk" | sha256sum -c -
          echo "2a9bc50c6672b1cb6efdfbd9bd9149bf280274e386305663163cc365abd393f3  $w/amaze.apk" | sha256sum -c -
          echo "998f7b8558e55fa4d40ea676414cb4bf35f9c9b6f0eae3c81f037186229c403c  $w/services.jar" | sha256sum -c -
          echo "96876415d8b4342952558fd30d6e11b0ca9355c802060c0a9740b6cc84fc4e1b  firmware/apks/com.navitel.apk" | sha256sum -c -
          python3 - "$w" <<'PY'
          import re, sys, zipfile
          from pathlib import Path
          w = Path(sys.argv[1])
          with zipfile.ZipFile(w / 'services.jar') as src, zipfile.ZipFile(w / 'manifest.apk') as manifest, zipfile.ZipFile(w / 'wrapper.apk', 'w') as dst:
              dst.writestr('AndroidManifest.xml', manifest.read('AndroidManifest.xml'))
              names = [n for n in src.namelist() if re.fullmatch(r'classes(?:[0-9]+)?\.dex', n)]
              if not names: raise SystemExit('Missing framework DEX')
              for name in names: dst.writestr(name, src.read(name))
          PY
          curl -fLsS --retry 3 --max-time 120 -o "$w/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          java -jar "$w/apktool.jar" d -f -r "$w/wrapper.apk" -o "$w/decoded" >/dev/null
          # Decode dex only; do not execute either Navitel APK.
          python3 - "$w" firmware/apks/com.navitel.apk <<'PY'
          import re, sys, zipfile
          from pathlib import Path
          w, new = Path(sys.argv[1]), Path(sys.argv[2])
          for name, apk in [('old', w / 'old.apk'), ('new', new)]:
              with zipfile.ZipFile(apk) as src, zipfile.ZipFile(w / 'manifest.apk') as manifest, zipfile.ZipFile(w / (name + '-wrapper.apk'), 'w') as dst:
                  dst.writestr('AndroidManifest.xml', manifest.read('AndroidManifest.xml'))
                  names = [n for n in src.namelist() if re.fullmatch(r'classes(?:[0-9]+)?\.dex', n)]
                  if not names: raise SystemExit('Missing ' + name + ' DEX')
                  for n in names: dst.writestr(n, src.read(n))
          PY
          java -jar "$w/apktool.jar" d -f -r "$w/old-wrapper.apk" -o "$w/old-decoded" >/dev/null
          java -jar "$w/apktool.jar" d -f -r "$w/new-wrapper.apk" -o "$w/new-decoded" >/dev/null
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$aapt"
          python3 tools/inspect_backup_feasibility.py "$aapt" "$w/decoded" "$w/old.apk" firmware/apks/com.navitel.apk "$w/amaze.apk" "$w/old-decoded" "$w/new-decoded" > reports/backup-feasibility-static.txt
      - name: Сохранить только текстовый отчёт
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/backup-feasibility-static.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: inspect Android backup feasibility'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
