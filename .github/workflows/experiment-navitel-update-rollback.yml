name: Лабораторный откат обновления Navitel
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/experiment-navitel-update-rollback.yml'
      - 'tools/experiment_navitel_update_rollback.sh'
      - 'tools/emulator_ui_clickable.py'
      - 'tests/test_emulator_ui_clickable.py'
      - 'tools/emulator_backup_confirmation.py'
      - 'tools/compare_resigned_apk.py'
      - 'tests/test_compare_resigned_apk.py'
      - 'tools/check_no_adb_lab_backup.py'
      - 'tests/fixtures/no-adb-backup-target/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить лабораторные инструменты
        run: |
          bash -n tools/experiment_navitel_update_rollback.sh
          python3 -m unittest discover -s tests -p 'test_compare_resigned_apk.py' -v
          python3 -m unittest discover -s tests -p 'test_emulator_ui_clickable.py' -v
      - name: Только одноразовый x86-эмулятор
        timeout-minutes: 28
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/experiment_navitel_update_rollback.sh
      - name: Сохранить диагностику при ошибке
        if: failure()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/navitel-uninstall-update-lab.log" || exit 0
          mkdir -p reports
          tr -d '\r' < "$RUNNER_TEMP/navitel-uninstall-update-lab.log" > reports/navitel-uninstall-update-lab-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/navitel-uninstall-update-lab-error.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: diagnose same-signature Navitel update lab'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Сохранить только текстовый отчёт
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/navitel-uninstall-update-lab.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: same-signature Navitel update lab'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
