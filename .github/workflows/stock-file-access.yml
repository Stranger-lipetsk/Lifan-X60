name: Доступ к файлам в штатном Android
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stock-file-access.yml'
      - 'tools/inspect_stock_file_access.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Скачать проверенный stock и распаковать APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full e2fsprogs curl
          mkdir -p "$RUNNER_TEMP/fw" "$RUNNER_TEMP/apks" "$RUNNER_TEMP/decoded" reports
          gh release download stock -p x60_2021.7z -D "$RUNNER_TEMP/fw"
          echo "75e7d6cd900fac971b55fec9f59913153bf7a1096bd761f7229c9a1d6d57b540  $RUNNER_TEMP/fw/x60_2021.7z" | sha256sum -c -
          7z e -y "$RUNNER_TEMP/fw/x60_2021.7z" -o"$RUNNER_TEMP/fw/image" system.img >/dev/null
          img="$RUNNER_TEMP/fw/image/system.img"
          echo "b6bbbe529942ffec250cad993ae9cbb808721c27cf2536fb3fb11120130e8545  $img" | sha256sum -c -
          for pair in 'Settings:/priv-app/ElSettings.apk' 'Launcher:/priv-app/Launcher2' 'CertInstaller:/app/CertInstaller.apk' 'DocumentsUI:/app/DocumentsUI.apk' 'Downloads:/app/DownloadProviderUi.apk' 'PackageInstaller:/app/PackageInstaller.apk' 'Camera2:/app/Camera2.apk' 'Music:/app/Music.apk'; do
            name=${pair%%:*}; path=${pair#*:}
            debugfs -R "dump $path $RUNNER_TEMP/apks/$name.apk" "$img"
            test -s "$RUNNER_TEMP/apks/$name.apk"
          done
          mkdir -p "$RUNNER_TEMP/all-apps"
          for dir in app priv-app; do
            debugfs -R "rdump /$dir $RUNNER_TEMP/all-apps" "$img" > "$RUNNER_TEMP/$dir-dump.log" 2>&1
            test -d "$RUNNER_TEMP/all-apps/$dir"
            if grep -iE 'no space left|input/output error|filesystem not open|failed to open|ext2.* error' "$RUNNER_TEMP/$dir-dump.log"; then exit 1; fi
          done
          find "$RUNNER_TEMP/all-apps" -type d -exec chmod u+rwx {} +
          find "$RUNNER_TEMP/all-apps" -type f -exec chmod u+r {} +
          curl -fLsS --retry 3 --max-time 120 -o "$RUNNER_TEMP/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
      - name: Проанализировать обработчики выбора файлов
        run: |
          set -euo pipefail
          for apk in "$RUNNER_TEMP"/apks/*.apk; do
            name=$(basename "$apk" .apk)
            java -jar "$RUNNER_TEMP/apktool.jar" d -f -r "$apk" -o "$RUNNER_TEMP/decoded/$name" >/dev/null
            test -d "$RUNNER_TEMP/decoded/$name/smali"
          done
          {
            echo 'Stock system image SHA-256: b6bbbe529942ffec250cad993ae9cbb808721c27cf2536fb3fb11120130e8545'
            echo 'Published launcher system has identical pre-existing file contents, see reports/published-launcher-comparison.txt.'
            for apk in "$RUNNER_TEMP"/apks/*.apk; do sha256sum "$apk" | sed "s|$RUNNER_TEMP/apks/||"; done
            python3 tools/inspect_stock_file_access.py "$RUNNER_TEMP/decoded" "$RUNNER_TEMP/all-apps"
          } > reports/stock-file-access.txt
          wc -c reports/stock-file-access.txt
          head -100 reports/stock-file-access.txt
      - name: Сохранить только отчёт
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stock-file-access.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: inspect stock file picker and installer'
          for try in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
