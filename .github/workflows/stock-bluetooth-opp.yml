name: Исследование Bluetooth OPP в штатной прошивке
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stock-bluetooth-opp.yml'
      - 'tools/inspect_stock_bluetooth.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Скачать stock и извлечь штатный Bluetooth APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full e2fsprogs curl aapt
          mkdir -p "$RUNNER_TEMP/fw" reports
          gh release download stock -p x60_2021.7z -D "$RUNNER_TEMP/fw"
          echo "75e7d6cd900fac971b55fec9f59913153bf7a1096bd761f7229c9a1d6d57b540  $RUNNER_TEMP/fw/x60_2021.7z" | sha256sum -c -
          7z e -y "$RUNNER_TEMP/fw/x60_2021.7z" -o"$RUNNER_TEMP/fw/image" system.img >/dev/null
          img="$RUNNER_TEMP/fw/image/system.img"
          echo "b6bbbe529942ffec250cad993ae9cbb808721c27cf2536fb3fb11120130e8545  $img" | sha256sum -c -
          debugfs -R "dump /app/Bluetooth.apk $RUNNER_TEMP/Bluetooth.apk" "$img"
          test -s "$RUNNER_TEMP/Bluetooth.apk"
          curl -fLsS --retry 3 --max-time 120 -o "$RUNNER_TEMP/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
      - name: Прочитать манифест и код без изменения образа
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/apktool.jar" d -f -r "$RUNNER_TEMP/Bluetooth.apk" -o "$RUNNER_TEMP/decoded" >/dev/null
          {
            echo 'Stock system SHA-256: b6bbbe529942ffec250cad993ae9cbb808721c27cf2536fb3fb11120130e8545'
            sha256sum "$RUNNER_TEMP/Bluetooth.apk" | sed "s|$RUNNER_TEMP/||"
            echo '## AndroidManifest binary XML tree'
            aapt dump xmltree "$RUNNER_TEMP/Bluetooth.apk" AndroidManifest.xml
            python3 tools/inspect_stock_bluetooth.py "$RUNNER_TEMP/decoded"
          } > reports/stock-bluetooth-opp.txt
          wc -c reports/stock-bluetooth-opp.txt
      - name: Сохранить только отчёт
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stock-bluetooth-opp.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: inspect stock Bluetooth object push'
          for try in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
