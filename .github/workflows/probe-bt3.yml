name: Bluetooth HAL и USB

on:
  push:
    paths:
      - 'autoanalysis/probe-bt3.txt'
  workflow_dispatch:

permissions: { contents: write }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl binutils >/dev/null 2>&1 || true
          mkdir -p reports
      - name: "Скачать прошивку"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl','-L','--fail','--retry','3','--max-time','2500',
                          '-o','/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          cp "$(find /tmp/rar -name system.img | head -1)" /tmp/system.img
      - name: "Проверки"
        run: |
          OUT="$GITHUB_WORKSPACE/reports/bt-hal.txt"
          exec > "$OUT" 2>&1 || true
          set +e
          echo "# Bluetooth HAL и USB"
          echo
          echo "## все библиотеки в /lib/hw"
          debugfs -R "ls /lib/hw" /tmp/system.img 2>/dev/null | tr -s ' ' | cut -d' ' -f6- | sort
          echo
          echo "## есть ли bluetooth.default.so"
          debugfs -R "stat /lib/hw/bluetooth.default.so" /tmp/system.img 2>&1 | tail -2
          echo
          echo "## bluetoothd / bluez утилиты"
          for f in /bin/bluetoothd /bin/hciconfig /bin/hcitool /bin/brcm_patchram_plus /bin/hciattach; do
            echo -n "$f: "
            debugfs -R "stat $f" /tmp/system.img 2>/dev/null | grep -c Inode
          done
          echo
          echo "## пакет com.android.bluetooth есть?"
          debugfs -R "ls /app" /tmp/system.img 2>/dev/null | grep -i bluetooth
          echo
          echo "## USB-хосты в init"
          debugfs -R "dump /init.el_imx6_solo_v2.usb.rc /tmp/usb.rc" /tmp/system.img 2>/dev/null
          grep -nE "usb|storage" /tmp/usb.rc 2>/dev/null | head -10
          echo
          echo "## fstab: какие разделы монтируются"
          debugfs -R "dump /fstab.el_imx6_solo_v2" /tmp/fstab /tmp/system.img 2>/dev/null
          debugfs -R "stat /fstab.el_imx6_solo_v2" /tmp/system.img 2>/dev/null | grep -c Inode
          for p in /fstab.el_imx6_solo_v2 /fstab; do
            debugfs -R "dump $p /tmp/fstab.txt" /tmp/system.img 2>/dev/null
            [ -s /tmp/fstab.txt ] && { echo "--- $p ---"; cat /tmp/fstab.txt; break; }
          done

      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports
          git diff --cached --quiet && exit 0
          git commit -m "проба: bluetooth HAL и USB"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
