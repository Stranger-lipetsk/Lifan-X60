name: Лабораторная проверка HOME-фильтра Launcher2
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/experiment-launcher-filter.yml'
      - 'tools/experiment_launcher_manifest.py'
      - 'tests/test_experiment_launcher_manifest.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить анализатор бинарного манифеста
        run: python3 -m unittest discover -s tests -p test_experiment_launcher_manifest.py -v
      - name: Изменить и проверить копию APK вне прошивки
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/launcher-experiment.log") 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs
          mkdir -p "$RUNNER_TEMP/input" reports
          gh release download 'рабочая-с-лаунчером' -p system.img -D "$RUNNER_TEMP/input"
          img="$RUNNER_TEMP/input/system.img"
          echo "79df29ec1ea97fd2e1da605c9651c6e5cce9d05d79518ff8e3e7d1dd16553dba  $img" | sha256sum -c -
          debugfs -R "dump /priv-app/Launcher2.apk $RUNNER_TEMP/Launcher2.apk" "$img" >/dev/null 2>&1
          echo "82787a6007589a169242f2c1391252342a9824748a8b469d1d522acab83458e6  $RUNNER_TEMP/Launcher2.apk" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/Launcher2.apk" AndroidManifest.xml > "$RUNNER_TEMP/manifest.bin"
          python3 tools/experiment_launcher_manifest.py "$RUNNER_TEMP/manifest.bin" "$RUNNER_TEMP/new-manifest.bin"
          python3 - "$RUNNER_TEMP/Launcher2.apk" "$RUNNER_TEMP/new-manifest.bin" "$RUNNER_TEMP/unsigned.apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as old, zipfile.ZipFile(sys.argv[3], 'w') as out:
              entries = old.infolist()
              if len({e.filename for e in entries}) != len(entries): raise SystemExit('Duplicate source ZIP entry')
              if sum(e.filename == 'AndroidManifest.xml' for e in entries) != 1: raise SystemExit('Expected one manifest')
              for entry in entries:
                  if entry.filename.upper().startswith('META-INF/'): continue
                  out.writestr(entry, open(sys.argv[2], 'rb').read() if entry.filename == 'AndroidManifest.xml' else old.read(entry))
          PY
          repo=Avnet/android-imx-device-fsl
          ref=495a2e2f50ecbd6d97922aeaf0224a90d1ed6d94
          for name in shared.x509.pem shared.pk8; do
            gh api "repos/$repo/contents/common/security/$name?ref=$ref" --jq .content | base64 -d > "$RUNNER_TEMP/$name"
            test -s "$RUNNER_TEMP/$name"
          done
          cert_sha=$(openssl x509 -in "$RUNNER_TEMP/shared.x509.pem" -outform DER | sha256sum | cut -d' ' -f1)
          pub_sha=$(openssl pkey -inform DER -in "$RUNNER_TEMP/shared.pk8" -pubout -outform DER | sha256sum | cut -d' ' -f1)
          test "$cert_sha" = 212912e875e5077f955c3079b6ceb1151c2b64d9bd9f6673dceff70d312eb2d5
          test "$pub_sha" = bd1f34978c137a333872b9e1f33e3d24e2edb8e080f23d87c2aa52149ace6fa5
          sdk=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          bt=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$bt/zipalign" -f 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --key "$RUNNER_TEMP/shared.pk8" --cert "$RUNNER_TEMP/shared.x509.pem" \
            --min-sdk-version 19 --v1-signing-enabled true --out "$RUNNER_TEMP/experimental-launcher.apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --min-sdk-version 19 --max-sdk-version 19 --verbose --print-certs "$RUNNER_TEMP/experimental-launcher.apk" > "$RUNNER_TEMP/verify.txt" 2>&1
          grep -F 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/verify.txt"
          grep -F "certificate SHA-256 digest: $cert_sha" "$RUNNER_TEMP/verify.txt"
          python3 tools/compare_apk_payload.py "$RUNNER_TEMP/Launcher2.apk" "$RUNNER_TEMP/experimental-launcher.apk" AndroidManifest.xml > "$RUNNER_TEMP/compare.txt"
          "$bt/aapt" dump xmltree "$RUNNER_TEMP/experimental-launcher.apk" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          if grep -F 'android.intent.category.HOME' "$RUNNER_TEMP/manifest.txt"; then echo 'HOME category still present'; exit 1; fi
          grep -F 'com.android.launcher2.Launcher' "$RUNNER_TEMP/manifest.txt" >/dev/null
          grep -F 'android.intent.action.MAIN' "$RUNNER_TEMP/manifest.txt" >/dev/null
          grep -F 'android.intent.category.DEFAULT' "$RUNNER_TEMP/manifest.txt" >/dev/null
          {
            echo '# Offline Launcher2 HOME category experiment — NOT DEVICE TESTED'
            echo 'Original Launcher2 SHA-256 82787a6007589a169242f2c1391252342a9824748a8b469d1d522acab83458e6'
            echo 'Exactly one HOME category removed; all other parsed manifest elements unchanged.'
            echo 'APK signed with matching Freescale development shared certificate.'
            echo 'Candidate not published or installed; explicit launching and HOME behavior remain untested.'
            cat "$RUNNER_TEMP/compare.txt" "$RUNNER_TEMP/verify.txt"
            echo '## Candidate manifest'
            cat "$RUNNER_TEMP/manifest.txt"
          } > reports/launcher2-filter-laboratory.txt
      - name: Диагностика ошибки лабораторной сборки
        if: failure()
        run: |
          set -e
          test -s "$RUNNER_TEMP/launcher-experiment.log" || exit 0
          mkdir -p reports
          cp "$RUNNER_TEMP/launcher-experiment.log" reports/launcher2-filter-laboratory-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/launcher2-filter-laboratory-error.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: diagnose launcher filter experiment'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Сохранить текстовый отчёт без artifacts
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/launcher2-filter-laboratory.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: offline launcher HOME category experiment'
          for try in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
