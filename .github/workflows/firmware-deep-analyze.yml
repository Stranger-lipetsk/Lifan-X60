name: Глубокий разбор прошивки

on:
  push:
    paths:
      - 'autoanalysis/deep.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  PUBLIC_KEY: https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Инструменты
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unrar-full unrar-free \
            e2fsprogs file cpio lz4 zlib1g-dev python3-dev >/dev/null 2>&1 || \
          sudo apt-get install -y -qq p7zip-full unrar e2fsprogs file cpio lz4 >/dev/null 2>&1 || true
          for t in 7z unrar unrar-free debugfs dump.rdb dump.cpio ls file cpio lz4; do
            printf '%-12s ' "$t"; command -v $t || echo НЕТ
          done
          sudo apt-get install -y -qq binwalk >/dev/null 2>&1 || true

      - name: "Скачивание архива"
        run: |
          mkdir -p firmware/original
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request
          pk = os.environ['PUBLIC_KEY']
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          data = json.load(urllib.request.urlopen(url, timeout=60))
          items = data['_embedded']['items']
          files = [i for i in items if i['type'] == 'file']
          # берём архив «прошивка офиц. 2016г.rar» (полный, с backup/config.ini)
          files.sort(key=lambda i: 0 if '2016' in i['name'] else 1)
          it = files[0]
          dest = os.path.join('firmware/original', it['name'])
          print('скачиваю', it['name'], it['size'])
          subprocess.run(['curl', '-L', '--fail', '--retry', '3', '--retry-delay', '5',
                          '--connect-timeout', '30', '--max-time', '2500',
                          '-o', dest, it['file']], check=True)
          print('OK', os.path.getsize(dest))
          PY

      - name: Распаковка архива
        run: |
          mkdir -p reports/unpacked
          for f in firmware/original/*; do
            [ -f "$f" ] || continue
            7z x -y -aos -o"reports/unpacked" "$f" >/dev/null 2>&1 || unrar x -o+ "$f" reports/unpacked/ >/dev/null 2>&1 || echo "!! $f"
          done
          find reports/unpacked -type f -printf '%s\t%p\n' | sort -rn | head -30

      - name: Глубокий разбор (fw_analyze.py)
        run: |
          python3 tools/fw_analyze.py reports/unpacked reports/deep 2>&1 | tee reports/deep-лог.txt | tail -80

      - name: "Дополнительно — ext4 без debugfs (резерв)"
        if: always()
        run: |
          SYS=$(find reports/unpacked -name 'system.img' | head -1)
          echo "system.img = $SYS"
          file "$SYS" || true
          # если sparse - конвертим и пробуем 7z
          (7z l "$SYS" 2>&1 || true) | head -40

      - name: Коммит отчётов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'firmware/\nreports/unpacked/\nreports/deep/props/system/\n' > .git/info/exclude
          # ограничим размер отчётов
          find reports -type f -size +20M -exec sh -c 'echo "урезаю $1"; head -c 20000000 "$1" > "$1.cut" && mv "$1.cut" "$1"' _ {} \;
          git add -A reports
          if git diff --cached --quiet; then echo "нет изменений"; exit 0; fi
          git commit -m "глубокий разбор прошивки: boot.img, ramdisk, system.img"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then
              echo "отчёты отправлены (попытка $try)"; exit 0
            fi
            echo "попытка $try не удалась, повтор через 10 с"; sleep 10
            git rebase --abort >/dev/null 2>&1 || true
          done
          echo "не удалось отправить отчёты — не критично, образ собран"

      - name: Артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-reports
          path: reports/
          retention-days: 7
