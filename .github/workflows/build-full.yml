name: Полный образ (Navitel, Яндекс, Torque)

on:
  push:
    paths:
      - 'autoanalysis/build-full.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl >/dev/null 2>&1 || true
          curl -sSL --retry 3 --max-time 300 -o /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          mkdir -p out reports
          echo "BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: "Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: "Скачать прошивку"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl', '-L', '--fail', '--retry', '3', '--max-time', '2500',
                          '-o', '/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          cp "$(find /tmp/rar -name system.img | head -1)" out/system-org.img

      - name: "Патч лаунчера"
        run: |
          debugfs -R "dump /priv-app/EL830LF01_Home.apk /tmp/Home.apk" out/system-org.img 2>&1 | tail -1
          java -jar /tmp/apktool.jar d -f /tmp/Home.apk -o /tmp/HomeDec 2>&1 | tail -2

          # имена пакетов берём из самих APK, а не из догадок
          ADDS=""
          for f in firmware/apks/*.apk; do
            [ -f "$f" ] || continue
            PKG=$("$BT/aapt" dump badging "$f" 2>/dev/null | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
            if [ -n "$PKG" ]; then
              echo "APK $f -> пакет $PKG" | tee -a reports/full-build.txt
              ADDS="$ADDS --add $PKG"
            else
              echo "APK $f: не удалось прочитать пакет (битый файл?)" | tee -a reports/full-build.txt
            fi
          done
          python3 tools/patch_launcher.py --dir /tmp/HomeDec $ADDS 2>&1 | tee -a reports/full-build.txt
          java -jar /tmp/apktool.jar b /tmp/HomeDec -o out/Home-patched.apk 2>&1 | tail -4

          # новый dex обязан грузиться: сверяем, что все ссылки разрешаются
          # (при ошибке в smali apktool молча выдаёт битый APK)
          curl -sSL --max-time 200 -o /tmp/baksmali.jar \
            https://github.com/baksmali/smali/releases/download/v2.5.2/baksmali-2.5.2.jar
          mkdir -p /tmp/chk && cd /tmp/chk && rm -rf ./*
          unzip -o -q "${GITHUB_WORKSPACE}/out/Home-patched.apk" classes.dex
          java -jar /tmp/baksmali.jar d classes.dex -o smali 2>&1 | tail -2
          if [ -d smali ]; then
            echo "DEX РАЗБИРАЕТСЯ БЕЗ ОШИБОК" | tee -a "${GITHUB_WORKSPACE}/reports/full-build.txt"
          else
            echo "DEX БИТЫЙ" | tee -a "${GITHUB_WORKSPACE}/reports/full-build.txt"
            exit 1
          fi

      - name: "Dex в штатный APK (подпись не меняется)"
        run: |
          # Пересобранный apktool-ом APK подписан чужим ключом — система такой
          # не примет. Берём из него только classes.dex и вставляем в заводской
          # APK: подпись, манифест и ресурсы остаются родными, меняется лишь
          # код. Dalvik на 4.4 подпись самого dex не проверяет.
          mkdir -p /tmp/ndex && cd /tmp/ndex && rm -rf ./*
          unzip -o -q "${GITHUB_WORKSPACE}/out/Home-patched.apk" classes.dex
          ls -l classes.dex
          cp /tmp/Home.apk "${GITHUB_WORKSPACE}/out/Home-new.apk"
          zip -q -0 "${GITHUB_WORKSPACE}/out/Home-new.apk" classes.dex
          cd "${GITHUB_WORKSPACE}"
          "$BT/zipalign" -f 4 out/Home-new.apk out/Home-aligned.apk 2>&1 | tail -2
          mv -f out/Home-aligned.apk out/Home-new.apk
          {
            echo
            echo "## лаунчер"
            ls -l /tmp/Home.apk out/Home-new.apk
            echo "dex внутри (метод должен быть STORED):"
            unzip -lv out/Home-new.apk | grep classes.dex
            echo "подпись нового файла:"
            keytool -printcert -jarfile out/Home-new.apk 2>&1 | grep -E "SHA1|Owner"
            echo "подпись заводского:"
            keytool -printcert -jarfile /tmp/Home.apk 2>&1 | grep -E "SHA1|Owner"
            echo "патч в dex:"
            unzip -p out/Home-new.apk classes.dex | strings | grep -c "yandexnavi" || true
          } 2>&1 | tee -a reports/full-build.txt

      - name: "Собрать панель"
        run: |
          bash switcher/build.sh 2>&1 | tail -4
          ls -l switcher/switcher.apk

      - name: "Урезать APK"
        run: |
          # В APK лежат библиотеки под x86/arm64, которые i.MX6 не использует,
          # и десятки голосов Navitel. Для системных APK Android 4.4 сверяет
          # подпись только у AndroidManifest.xml, поэтому файл можно править.
          mkdir -p out/apks
          for f in firmware/apks/*.apk; do
            [ -f "$f" ] || continue
            PKG=$(basename "$f" .apk)
            EXTRA=""
            case "$PKG" in
              com.navitel*) EXTRA="--voices ru en --locale ru en" ;;
            esac
            python3 tools/trim_apk.py --apk "$f" --out "out/apks/$PKG.apk" --compress $EXTRA \
              2>&1 | tee -a reports/full-build.txt
            # манифест и подпись обязаны остаться на месте
            unzip -l "out/apks/$PKG.apk" | grep -q "AndroidManifest.xml" \
              || { echo "В $PKG НЕТ МАНИФЕСТА" | tee -a reports/full-build.txt; exit 1; }
            unzip -l "out/apks/$PKG.apk" | grep -q "META-INF/.*\.RSA" \
              || echo "ВНИМАНИЕ: в $PKG нет блока подписи" | tee -a reports/full-build.txt
          done
          ls -l out/apks/

      - name: "Собрать образ"
        run: |
          REMOVE=""
          for p in Navitel-9.13.73-large.apk; do REMOVE="$REMOVE --remove /priv-app/$p"; done
          for p in BSEDemo EL830TAM1_GPIO_TEST_2015.01.01.01 CubeLiveWallpapers \
                   VisualizationWallpapers BasicDreams WfdSink FSLOta HTMLViewer; do
            REMOVE="$REMOVE --remove /app/$p.apk"
          done

          ADD=""
          ADD="$ADD --add-apk switcher/switcher.apk:/app"
          ADD="$ADD --add-file out/Home-new.apk:/priv-app/EL830LF01_Home.apk"
          for f in out/apks/*.apk; do
            [ -f "$f" ] || continue
            PKG=$("$BT/aapt" dump badging "$f" 2>/dev/null | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
            [ -n "$PKG" ] || { echo "пропуск $f: не APK" | tee -a reports/full-build.txt; continue; }
            # Navitel требует системных прав на чтение лицензии -> /priv-app
            case "$PKG" in
              com.navitel*) ADD="$ADD --add-apk $f:/priv-app" ;;
              *)            ADD="$ADD --add-apk $f:/app" ;;
            esac
          done
          echo "добавляем:$ADD" | tee -a reports/full-build.txt

          python3 tools/inplace_patch.py \
            --system out/system-org.img --out out/system-full.img \
            $REMOVE $ADD \
            --add-file tools/system-files/install-recovery.sh:/etc/install-recovery.sh \
            2>&1 | tee -a reports/full-build.txt

      - name: "Проверка образа"
        run: |
          {
            echo
            echo "## сверка лаунчера с собранным"
            debugfs -R "dump /priv-app/EL830LF01_Home.apk /tmp/chk-home.apk" out/system-full.img 2>&1 | tail -1
            sha256sum /tmp/chk-home.apk out/Home-new.apk
            if ! cmp -s /tmp/chk-home.apk out/Home-new.apk; then
              echo "ЛАУНЧЕР В ОБРАЗЕ НЕ СОВПАДАЕТ С СОБРАННЫМ"; exit 1
            fi
            echo "лаунчер в образе: наш"
            echo
            echo "## содержимое образа"
            debugfs -R "ls -l /app" out/system-full.img 2>/dev/null | grep -iE "navitel|yandex|torque|switcher"
            debugfs -R "ls -l /priv-app" out/system-full.img 2>/dev/null | grep -iE "navitel|yandex|torque|Home"
            echo "размер лаунчера в образе:"
            debugfs -R "stat /priv-app/EL830LF01_Home.apk" out/system-full.img 2>/dev/null | grep -i "Size:"
            echo "в APK внутри образа: маркер патча (yandexnavi/torque)"
            debugfs -R "dump /priv-app/EL830LF01_Home.apk /tmp/in-img.apk" out/system-full.img 2>&1 | tail -1
            unzip -p /tmp/in-img.apk classes.dex | strings | grep -cE "yandexnavi|prowl.torque"
            sha256sum out/system-full.img
            e2fsck -fn out/system-full.img 2>&1 | tail -3
          } 2>&1 | tee -a reports/full-build.txt

      - name: "Публикация"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp out/system-full.img out/system.img
          NOTE="Приложения в образе: Navitel, Яндекс Навигатор, Torque Pro.
          Лаунчер патчен (кнопки на главном экране), подпись файла заводская."
          if gh release view lite-apps >/dev/null 2>&1; then
            gh release upload lite-apps out/system.img --clobber
          else
            gh release create lite-apps out/system.img --title "Образ с приложениями" --notes "$NOTE"
          fi

      - name: "Коммит отчёта"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports
          git diff --cached --quiet && exit 0
          git commit -m "полная сборка: отчёт"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
