name: WiFi — чип и прошивка

on:
  push:
    paths:
      - 'autoanalysis/probe-wifi2.txt'
  workflow_dispatch:

permissions: { contents: write }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl binutils >/dev/null 2>&1 || true
          mkdir -p reports
      - name: "Скачать прошивку"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl','-L','--fail','--retry','3','--max-time','2500',
                          '-o','/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          cp "$(find /tmp/rar -name system.img | head -1)" /tmp/system.img
      - name: "Файлы прошивки"
        run: |
          OUT="$GITHUB_WORKSPACE/reports/wifi-чип.txt"
          exec > "$OUT" 2>&1 || true
          set +e
          echo "# WiFi: какой чип и есть ли прошивка"
          echo
          echo "## каталоги, где может лежать прошивка радио"
          for d in /etc/firmware /lib/firmware /vendor/firmware /bin/firmware; do
            echo "--- $d"
            debugfs -R "ls -l $d" /tmp/system.img 2>&1 | grep -vE "^debugfs|^ *$" | tail -12
          done
          echo
          echo "## любые файлы с именами TI"
          debugfs -R "ls -l /etc" /tmp/system.img 2>/dev/null | grep -iE "wl|ti-|firmware"
          echo
          echo "## конфиг wl18xx (первые строки — версия)"
          debugfs -R "dump /etc/wifi/wlconf/wl18xx-conf-default.bin /tmp/wl18.bin" /tmp/system.img 2>/dev/null
          ls -l /tmp/wl18.bin 2>/dev/null
          echo
          echo "## что ядро ищет по имени файла прошивки"
          debugfs -R "dump /etc/firmware/bcm20710a1.hcd /tmp/bcm.hcd" /tmp/system.img 2>/dev/null
          ls -l /tmp/bcm.hcd 2>/dev/null
      - name: "Строки ядра"
        run: |
          OUT="$GITHUB_WORKSPACE/reports/wifi-чип.txt"
          exec >> "$OUT" 2>&1 || true
          set +e
          echo
          echo "## строки ядра про TI WiFi"
          for pat in wl18xx wl1271 wlcore wl12xx "wl18xx-fw" "ti-connectivity" "wl1271-nvs" nvs; do
            n=$(grep -ac "$pat" "$GITHUB_WORKSPACE/reports/deep2/kernel/kernel-gz0.bin.strings")
            echo "  $pat: ${n:-0}"
          done
          echo
          echo "## возможные имена файлов прошивки в строках ядра"
          grep -aoE "wl[0-9]+[a-z]*-[a-z0-9.-]+\\.bin|wl[0-9]+-nvs\\.bin|ti-connectivity" \
            "$GITHUB_WORKSPACE/reports/deep2/kernel/kernel-gz0.bin.strings" 2>/dev/null | sort -u | head
          echo
          echo "## драйвер: какие имена модулей есть"
          grep -aoE "wlcore[a-z_]*|wl18xx[a-z_]*|wl12xx[a-z_]*|wl1271[a-z_]*" \
            "$GITHUB_WORKSPACE/reports/deep2/kernel/kernel-gz0.bin.strings" 2>/dev/null | sort | uniq -c | sort -rn | head -10

      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports
          git diff --cached --quiet && exit 0
          git commit -m "проба: чип WiFi и прошивка"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
