name: Тест сборки system.img

on:
  push:
    paths:
      - 'autoanalysis/buildtest.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unrar-free e2fsprogs android-sdk-libsparse-utils >/dev/null 2>&1 || \
          sudo apt-get install -y -qq p7zip-full unrar-free e2fsprogs >/dev/null 2>&1 || true
          for t in make_ext4fs debugfs mke2fs simg2img; do printf '%-14s ' "$t"; command -v $t || echo НЕТ; done
          # make_ext4fs может отсутствовать в новых Ubuntu — соберём из android-tools или возьмём из pip-пакета
          if ! command -v make_ext4fs >/dev/null; then
            echo "make_ext4fs нет — используем mke2fs -d (fallback в скрипте)"
          fi
      - name: "Скачать прошивку"
        run: |
          mkdir -p firmware/original
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type']=='file' and '2016' in i['name']][0]
          dest = os.path.join('firmware/original', it['name'])
          subprocess.run(['curl','-L','--fail','--retry','3','--max-time','2500','-o',dest,it['file']], check=True)
          print('OK', os.path.getsize(dest))
          PY
          ls -lh firmware/original/
      - name: "Нормализовать имя архива (латиница)"
        run: |
          mkdir -p fw
          SRC=$(ls firmware/original/*.rar 2>/dev/null | head -1)
          echo "исходный: $SRC"
          cp "$SRC" fw/firmware.rar
          ls -lh fw/
      - name: "Тест сборки (лайт-набор)"
        run: |
          set -o pipefail
          echo "== окружение =="
          python3 --version
          for t in make_ext4fs mke2fs debugfs 7z unrar unrar-free; do printf '%-14s ' "$t"; command -v $t || echo НЕТ; done
          echo "== запуск =="
          python3 tools/build_system.py \
            --fw fw/firmware.rar \
            --out out/system-test.img \
            --remove /priv-app/Navitel-9.13.73-large.apk \
            --remove "/app/IQQIService-Elead-International-20160105.1.apk" \
            --remove /app/BSEDemo.apk \
            --set-prop ro.product.locale.language=ru \
            --set-prop ro.product.locale.region=RU \
            --keep-work 2>&1 | tee reports/build-log.txt | tail -60
          echo "код выхода: $?"
          ls -lh out/ 2>/dev/null || echo "out пуст"
      - name: "Строгая проверка: размер раздела и монтируемость"
        if: always()
        run: |
          {
            IMG=out/system-test.img
            echo "=== размер ==="
            ls -lh "$IMG" 2>/dev/null
            SZ=$(stat -c%s "$IMG" 2>/dev/null || echo 0)
            echo "байт: $SZ  (лимит раздела p3 = 536870912)"
            if [ "$SZ" -gt 536870912 ]; then echo "!!! ПРЕВЫШЕН РАЗМЕР РАЗДЕЛА"; fi
            echo "=== фичи ext4 (должно НЕ быть 64bit) ==="
            dumpe2fs -h "$IMG" 2>/dev/null | grep -E "features|Block size|Inode size|Block count"
            dumpe2fs -h "$IMG" 2>/dev/null | grep -q 64bit && echo "!!! 64bit — несовместимо" || echo "64bit отсутствует — OK"
            echo "=== владельцы файлов ==="
            debugfs -R 'ls -l /app' "$IMG" 2>/dev/null | head -5
            echo "=== монтирование (проверка читаемости) ==="
            sudo mkdir -p /mnt/chk && sudo mount -o loop,ro "$IMG" /mnt/chk 2>&1 && ls /mnt/chk | head -20 && du -sh /mnt/chk && sudo umount /mnt/chk
            echo "=== содержит ли /system/bin/su и PackageInstaller ==="
            debugfs -R 'ls -l /bin' "$IMG" 2>/dev/null | grep -w su || echo "su не найден в /bin"
            debugfs -R 'ls -l /app' "$IMG" 2>/dev/null | grep -i PackageInstaller || echo "PackageInstaller отсутствует"
          } 2>&1 | tee reports/build-strict.txt
      - name: "Проверка результата"
        if: always()
        run: |
          {
            echo "=== out ==="
            ls -lh out/ 2>/dev/null
            IMG=out/system-test.img
            if [ -f "$IMG" ]; then
              echo "=== file ==="; file "$IMG"
              echo "=== fsck (кратко) ==="; e2fsck -fn "$IMG" 2>&1 | tail -15 || true
              echo "=== содержимое корня ==="; debugfs -R 'ls -l /' "$IMG" 2>/dev/null | head -25
              echo "=== проверяем удалённое ==="
              debugfs -R 'ls -l /priv-app' "$IMG" 2>/dev/null | grep -i navitel || echo "Navitel удалён — ОК"
              debugfs -R 'ls -l /app' "$IMG" 2>/dev/null | grep -iE "IQQI|BSEDemo" || echo "IQQI/BSEDemo удалены — ОК"
              echo "=== build.prop ==="
              debugfs -R 'cat /build.prop' "$IMG" 2>/dev/null | grep -E "locale|version.release" || true
              echo "=== объём ==="; du -h "$IMG"
            else
              echo "ОБРАЗ НЕ СОБРАН"
            fi
          } 2>&1 | tee reports/build-result.txt
      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'firmware/\nfw/\nreports/unpacked/\nout/\n' > .git/info/exclude
          git add -A reports
          if git diff --cached --quiet; then echo "нет изменений"; exit 0; fi
          git commit -m "тест сборки system.img: результат и проверка"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then
              echo "отчёты отправлены (попытка $try)"; exit 0
            fi
            echo "попытка $try не удалась, повтор через 10 с"; sleep 10
            git rebase --abort >/dev/null 2>&1 || true
          done
          echo "не удалось отправить отчёты — не критично, образ собран"
