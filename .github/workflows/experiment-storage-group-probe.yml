name: Лабораторная модель прав накопителя
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/experiment-storage-group-probe.yml'
      - 'tools/experiment_storage_group_probe.sh'
      - 'tests/test_storage_group_probe.py'
      - 'tests/fixtures/storage-group-probe/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить ограничения стенда
        run: |
          bash -n tools/experiment_storage_group_probe.sh
          python3 -m unittest discover -s tests -p 'test_storage_group_probe.py' -v
      - name: Только изолированный эмулятор
        timeout-minutes: 18
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/experiment_storage_group_probe.sh
      - name: Сохранить диагностику при ошибке
        if: failure()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/storage-group-probe-lab.log" || exit 0
          mkdir -p reports
          tr -d '\r' < "$RUNNER_TEMP/storage-group-probe-lab.log" > reports/stock-storage-group-emulator-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stock-storage-group-emulator-error.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: diagnose emulator storage group probe'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Сохранить только текстовый отчёт
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stock-storage-group-emulator.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: synthetic storage group probe'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
