name: Лабораторная проверка штатного su на ARM
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/experiment-su-lab.yml'
      - 'tools/experiment_su_lab.sh'
      - 'tests/test_su_lab_fixture.py'
      - 'tests/fixtures/su-lab/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить безопасные ограничения fixture
        run: |
          bash -n tools/experiment_su_lab.sh
          python3 -m unittest discover -s tests -p 'test_su_lab_fixture.py' -v
      - name: Только виртуальный Android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/experiment_su_lab.sh
      - name: Сохранить диагностику при ошибке
        if: failure()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/su-lab.log" || exit 0
          mkdir -p reports
          tr -d '\r' < "$RUNNER_TEMP/su-lab.log" > reports/su-identity-lab-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/su-identity-lab-error.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: diagnose disposable su fixture'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Сохранить только текстовый отчёт
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/su-identity-lab.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: stock su isolated identity check'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
