name: Внешняя синтетическая копия и запуск ARM-эмулятора
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths: ['.github/workflows/experiment-navitel-arm-external.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить лабораторные инструменты
        run: |
          bash -n tools/experiment_navitel_arm_tarboot.sh
          bash -n tools/stock_mke2fs_stream_lab.sh
          bash -n tools/external_backup_ci_lab.sh
          tar --version | head -1
          python3 -m unittest discover -s tests -p 'test_check_offline_tar_snapshot.py' -v
          python3 -m unittest discover -s tests -p 'test_compare_offline_snapshot_trees.py' -v
          python3 -m unittest discover -s tests -p 'test_compare_resigned_apk.py' -v
          python3 -m unittest discover -s tests -p 'test_no_adb_navitel_arm_fixture.py' -v
          python3 -m unittest discover -s tests -p 'test_multi_navitel_lab_backup.py' -v
      - name: Только одноразовый ARM-эмулятор
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAB_COPY_STRATEGY: external
        run: bash tools/experiment_navitel_arm_tarboot.sh
      - name: Сохранить диагностику при ошибке
        if: failure()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/navitel-arm-external-lab.log" || exit 0
          mkdir -p reports
          tr -d '\r' < "$RUNNER_TEMP/navitel-arm-external-lab.log" > reports/navitel-arm-external-lab-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/navitel-arm-external-lab-error.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: diagnose external synthetic backup lab'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Сохранить только текстовый отчёт
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/navitel-arm-external-lab.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: external synthetic backup lab'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
