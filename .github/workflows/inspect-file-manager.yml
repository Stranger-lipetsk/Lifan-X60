name: Проверка файлового менеджера для Android 4.4
on:
  push:
    paths:
      - '.github/workflows/inspect-file-manager.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Скачать исходный APK из релиза автора и проверить
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate" reports
          gh release download v3.5.3 --repo TeamAmaze/AmazeFileManager --pattern app-fdroid-release.apk -D "$RUNNER_TEMP/candidate"
          apk="$RUNNER_TEMP/candidate/app-fdroid-release.apk"
          test -s "$apk"
          aapt=$(find /usr/local/lib/android/sdk/build-tools -type f -name aapt | sort -V | tail -1)
          apksigner=$(find /usr/local/lib/android/sdk/build-tools -type f -name apksigner | sort -V | tail -1)
          test -x "$aapt" && test -x "$apksigner"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.amaze.filemanager'" "$RUNNER_TEMP/badging.txt"
          grep -F "sdkVersion:'14'" "$RUNNER_TEMP/badging.txt"
          grep -F 'launchable-activity:' "$RUNNER_TEMP/badging.txt"
          "$apksigner" verify --min-sdk-version 19 --max-sdk-version 19 --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          {
            echo '# Amaze File Manager v3.5.3: inspection, not a device test'
            echo 'Source: TeamAmaze/AmazeFileManager, release v3.5.3, app-fdroid-release.apk, asset ID 30469350.'
            echo 'Source repository tag commit: 92139421b631e0199705ce90321fe17d7c5ee72d.'
            sha256sum "$apk" | sed "s|$RUNNER_TEMP/candidate/||"
            stat -c 'Bytes: %s' "$apk"
            echo '## Manifest badging'
            cat "$RUNNER_TEMP/badging.txt"
            echo '## API 19 signature verification'
            cat "$RUNNER_TEMP/signature.txt"
          } > reports/file-manager-candidate.txt
          cat reports/file-manager-candidate.txt
      - name: Сохранить только отчёт
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/file-manager-candidate.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: inspect Android 4.4 file manager candidate'
          for try in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
