name: Отладка патча 2

on:
  push:
    paths:
      - 'autoanalysis/probe-debug2.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl >/dev/null 2>&1 || true
          mkdir -p probes
          curl -sSL --retry 3 --max-time 300 -o /tmp/baksmali.jar \
            https://github.com/baksmali/smali/releases/download/v2.5.2/baksmali-2.5.2.jar
      - name: "Скачать"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl', '-L', '--fail', '--retry', '3', '--max-time', '2500',
                          '-o', '/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          SYSIMG="$(find /tmp/rar -name system.img | head -1)"
          debugfs -R "dump /priv-app/EL830LF01_Home.apk /tmp/Home.apk" "$SYSIMG" 2>&1 | tail -1
          mkdir -p /tmp/home && cd /tmp/home && unzip -o -q /tmp/Home.apk
          java -jar /tmp/baksmali.jar d classes.dex -o smali 2>&1 | tail -2
      - name: "Отладка"
        run: |
          OUT="${GITHUB_WORKSPACE}/probes/debug2.txt"
          cat > /tmp/dbg.py <<'PY'
          import re
          path = '/tmp/home/smali/tw/com/elead/el830/home/HomeApp.smali'
          t = open(path, encoding='utf-8').read()
          lines = []
          lines.append('# Отладка патча')
          lines.append('')
          lines.append('файл: %d символов' % len(t))
          ms = re.findall(r'^\.method[^\n]*loadEleadApplications[^\n]*$', t, re.M)
          lines.append('объявления метода: %r' % ms)
          m = re.search(r'\.method private loadEleadApplications\(\)V.*?\n\.end method', t, re.S)
          lines.append('regex нашёл: %s' % bool(m))
          if m:
              body = m.group(0)
              lines.append('длина: %d' % len(body))
              mm = re.search(r'^\s*:cond_23e\s*$', body, re.M)
              lines.append('cond_23e: %s' % (mm.start() if mm else None))
              if mm:
                  tail = body[mm.end():]
                  mp = re.search(r'invoke-virtual \{[^}]*\}, Ljava/util/HashMap;->put', tail)
                  lines.append('put после метки: %s' % (mp.start() if mp else None))
                  lines.append('--- после метки 400 символов ---')
                  lines.append(tail[:400])
          open('/home/runner/work/Lifan-X60/Lifan-X60/probes/debug2.txt', 'w').write('\n'.join(lines))
          PY
          python3 /tmp/dbg.py && cat "$OUT"
      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probes
          git diff --cached --quiet && exit 0
          git commit -m "проба: отладка патча 2"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
