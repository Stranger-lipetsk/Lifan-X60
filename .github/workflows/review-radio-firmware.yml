name: Review Wi-Fi and Bluetooth firmware

on:
  push:
    paths:
      - '.github/workflows/review-radio-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full e2fsprogs file cpio binutils
      - name: Download source firmware from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/radio-review/source" "$RUNNER_TEMP/radio-review/unpacked"
          gh release download stock --repo "$GITHUB_REPOSITORY" \
            --pattern 'x60_2021.7z' --dir "$RUNNER_TEMP/radio-review/source"
          archive="$RUNNER_TEMP/radio-review/source/x60_2021.7z"
          echo '75e7d6cd900fac971b55fec9f59913153bf7a1096bd761f7229c9a1d6d57b540  '"$archive" | sha256sum -c -
          7z x -y "$archive" -o"$RUNNER_TEMP/radio-review/unpacked" >/dev/null
          find "$RUNNER_TEMP/radio-review/unpacked" -type f -printf '%s %p\n' | sort -nr | head -200
      - name: Analyze boot, init, drivers, firmware and NVS references
        run: |
          set -euo pipefail
          python3 tools/fw_analyze.py "$RUNNER_TEMP/radio-review/unpacked" reports/radio-firmware-review
          mkdir -p reports/radio-firmware-review
          {
            echo '# Radio firmware source-image review'
            echo
            echo "Source release: stock / x60_2021.7z"
            echo "Archive SHA-256: $(sha256sum "$RUNNER_TEMP/radio-review/source/x60_2021.7z" | cut -d' ' -f1)"
            echo
            echo '## Radio-related files found in extracted source archive'
            find "$RUNNER_TEMP/radio-review/unpacked" -type f | grep -Ei '(^|/)(init[^/]*\.rc|.*wifi.*|.*wlan.*|.*bluetooth.*|.*bluelet.*|.*bt_vendor.*|.*wl12.*|.*wl18.*|.*wl127.*|.*\.hcd|.*nvs.*|.*ti-connectivity.*|.*\.ko$)' | sort || true
            echo
            echo '## Firmware analyzer output inventory'
            find reports/radio-firmware-review -maxdepth 2 -type f -printf '%p (%s bytes)\n' | sort
            echo
            echo '## Exact init and driver configuration excerpts'
            find "$RUNNER_TEMP/radio-review/unpacked" -type f \( -name '*.rc' -o -name '*.conf' -o -name '*.sh' -o -name 'modules.*' -o -name 'ueventd*.rc' \) -print0 |
            while IFS= read -r -d '' f; do
              if grep -qiE 'wifi|wlan|wl12|wl18|wl127|bluetooth|bluelet|hci_tty|ttymxc1|ttyO1|nvs|firmware|insmod|modprobe' "$f"; then
                echo "### $f"
                grep -inE 'wifi|wlan|wl12|wl18|wl127|bluetooth|bluelet|hci_tty|ttymxc1|ttyO1|nvs|firmware|insmod|modprobe' "$f" || true
              fi
            done
          } > reports/radio-firmware-review/summary.md
          cat reports/radio-firmware-review/summary.md
      - name: Inspect exact system radio payloads and kernel driver markers
        run: |
          set -euo pipefail
          system_image=$(find "$RUNNER_TEMP/radio-review/unpacked" -name system.img -print -quit)
          boot_image=$(find "$RUNNER_TEMP/radio-review/unpacked" -name boot.img -print -quit)
          test -s "$system_image"
          mkdir -p reports/radio-firmware-review
          rm -f reports/radio-firmware-review/system-radio/*
          out="$RUNNER_TEMP/radio-review/system-radio"
          mkdir -p "$out"
          report=reports/radio-firmware-review/system-radio-inventory.txt
          {
            echo '# Exact stock system radio payload inventory'
            echo 'Source: x60_2021.7z; read-only debugfs extraction; no target execution.'
            for path in /etc/wifi /etc/wifi/wlconf /etc/bluetooth /etc/firmware /vendor/firmware /vendor/firmware/ti-connectivity /system/lib/modules /lib/modules /lib/hw; do
              echo "## $path"
              debugfs -R "ls -l $path" "$system_image" 2>&1 || true
            done
          } > "$report"
          for p in /etc/wifi/nvram.txt /etc/wifi/wpa_supplicant.conf /etc/bluetooth/bt_vendor.conf /etc/firmware/bcm20710a1.hcd /vendor/firmware/fw_bcm40181a2.bin /vendor/firmware/fw_bcm40181a2_apsta.bin /vendor/firmware/fw_bcm40181a2_p2p.bin /etc/wifi/wlconf/wl18xx-conf-default.bin /etc/wifi/wlconf/struct.bin; do
            name=$(echo "$p" | tr '/' '_')
            dest="$out/${name#/}.bin"
            debugfs -R "dump $p $dest" "$system_image" >/dev/null 2>&1 || rm -f "$dest"
          done
          {
            echo '## Extracted payload hashes (raw payload files remain in runner temp)'
            find "$out" -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r sha256sum
            echo '## NVRAM calibration file'
            echo 'Present at /etc/wifi/nvram.txt; contents are deliberately not copied into the report.'
            echo '## Driver modules present in system image'
            grep -Ei '\.ko([[:space:]]|$)|wl12|wl18|wl127|bcmdhd|cfg80211|bluelet|bt-vendor' "$report" || true
          } >> "$report"
          if [ -s "$boot_image" ]; then
            python3 - "$boot_image" "$out/kernel" "$out/kernel-radio-strings.txt" <<'PYCODE'
          import re, struct, subprocess, sys
          image = open(sys.argv[1], 'rb').read()
          if image[:8] != b'ANDROID!': raise SystemExit('Invalid Android boot image')
          kernel_size, = struct.unpack_from('<I', image, 8)
          page_size, = struct.unpack_from('<I', image, 36)
          kernel = image[page_size:page_size + kernel_size]
          open(sys.argv[2], 'wb').write(kernel)
          strings = subprocess.run(['strings', '-a', '-n', '5', sys.argv[2]], capture_output=True, text=True, check=True).stdout.splitlines()
          rx = re.compile(r'(?i)(wl12|wl18|wl127|bcmdhd|brcm|bcm43|ap6251|firmware|nvs|cfg80211|hci_uart|bluetooth|bluelet|rfkill)')
          open(sys.argv[3], 'w').write('\n'.join(x for x in strings if rx.search(x)) + '\n')
          PYCODE
          fi
          {
            echo '## Extracted boot-kernel radio-related strings (static markers only)'
            cat "$out/kernel-radio-strings.txt" 2>/dev/null || true
          } >> "$report"
      - name: Inspect the full SD boot ramdisk without executing its programs
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/radio-review/unpacked/sd_boot.img"
          test -s "$image"
          mkdir -p reports/radio-firmware-review
          python3 tools/inspect_sd_boot_update.py "$image" > reports/radio-firmware-review/sd-boot-ramdisk-radio-audit.txt
          grep -inE 'wifi|wlan|wl12|wl18|wl127|bluetooth|bluelet|hci_tty|ttymxc1|ttyO1|nvs|firmware|insmod|modprobe|uim|ti-connectivity' reports/radio-firmware-review/sd-boot-ramdisk-radio-audit.txt | head -250 || true
      - name: Save text reports to this branch
        if: always()
        run: |
          set -euo pipefail
          if [ ! -d reports/radio-firmware-review ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/radio-firmware-review
          git diff --cached --quiet && exit 0
          git commit -m 'report: inspect source firmware radio drivers'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" >/dev/null 2>&1 && git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 8
          done
          exit 1
