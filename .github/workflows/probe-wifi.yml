name: WiFi — прошивка и калибровка

on:
  push:
    paths:
      - 'autoanalysis/probe-wifi.txt'
  workflow_dispatch:

permissions: { contents: write }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl binutils >/dev/null 2>&1 || true
          mkdir -p reports
      - name: "Скачать прошивку"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl','-L','--fail','--retry','3','--max-time','2500',
                          '-o','/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          cp "$(find /tmp/rar -name system.img | head -1)" /tmp/system.img
      - name: "Проверки"
        run: |
          OUT="$GITHUB_WORKSPACE/reports/wifi-файлы.txt"
          exec > "$OUT" 2>&1 || true
          set +e
          echo "# WiFi: файлы, прошивка, калибровка"
          echo
          echo "## /etc/wifi/wlconf"
          debugfs -R "ls -l /etc/wifi/wlconf" /tmp/system.img 2>&1 | tail -10
          echo
          echo "## прошивки радио (*.bin) во всём /etc"
          debugfs -R "rdump /etc /tmp/etc" /tmp/system.img 2>/dev/null | tail -1
          find /tmp/etc -name "*.bin" -o -name "*.hcd" -o -name "*nvs*" 2>/dev/null | head -20
          echo
          echo "## wpa_supplicant.conf"
          cat /tmp/etc/wifi/wpa_supplicant.conf 2>/dev/null
          echo
          echo "## wl1271-nvs.bin где-нибудь"
          find /tmp/etc -iname "*nvs*" 2>/dev/null
          echo
          echo "## каталог /system/bin/wifi"
          debugfs -R "ls -l /bin/wifi" /tmp/system.img 2>&1 | tail -8
          echo
          echo "## rc.wifi (если есть)"
          debugfs -R "dump /bin/wifi/rc.wifi /tmp/rcwifi" /tmp/system.img 2>/dev/null
          cat /tmp/rcwifi 2>/dev/null | head -20

      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports
          git diff --cached --quiet && exit 0
          git commit -m "проба: файлы WiFi"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
