name: Структура штатной оболочки и Android
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stock-structure-check.yml'
      - 'tools/inspect_stock_structure.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Извлечь только файлы из оригинального образа
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full e2fsprogs
          mkdir -p "$RUNNER_TEMP/fw" "$RUNNER_TEMP/apks" reports
          gh release download stock --pattern x60_2021.7z --dir "$RUNNER_TEMP/fw"
          echo "75e7d6cd900fac971b55fec9f59913153bf7a1096bd761f7229c9a1d6d57b540  $RUNNER_TEMP/fw/x60_2021.7z" | sha256sum -c -
          7z x -y "$RUNNER_TEMP/fw/x60_2021.7z" -o"$RUNNER_TEMP/fw/unpacked" >/dev/null
          img="$RUNNER_TEMP/fw/unpacked/system.img"
          debugfs -R "dump /priv-app/EL830LF01_Home.apk $RUNNER_TEMP/apks/Home.apk" "$img"
          debugfs -R "dump /app/EL831CLF01_MirrorLink_2016.06.13.01.apk $RUNNER_TEMP/apks/MirrorLink.apk" "$img"
          debugfs -R "dump /app/EL831CLF01_MediaPlayer_2017.01.11.01.apk $RUNNER_TEMP/apks/MediaPlayer.apk" "$img"
          debugfs -R "dump /priv-app/ElSettings.apk $RUNNER_TEMP/apks/Settings.apk" "$img"
          debugfs -R "dump /app/PackageInstaller.apk $RUNNER_TEMP/apks/PackageInstaller.apk" "$img"
          debugfs -R "dump /framework/framework-res.apk $RUNNER_TEMP/apks/Framework.apk" "$img"
          debugfs -R "dump /bin/check_usb_iface.sh $RUNNER_TEMP/check_usb_iface.sh" "$img"
          for f in "$RUNNER_TEMP"/apks/*.apk; do test -s "$f"; done
      - name: Исследовать структуру и подписи API 19
        run: |
          set -euo pipefail
          aapt=$(find /usr/local/lib/android/sdk/build-tools -type f -name aapt | sort -V | tail -1)
          apksigner=$(find /usr/local/lib/android/sdk/build-tools -type f -name apksigner | sort -V | tail -1)
          test -x "$aapt" && test -x "$apksigner"
          python3 tools/inspect_stock_structure.py "$RUNNER_TEMP/apks" "$aapt" "$apksigner" "$RUNNER_TEMP/check_usb_iface.sh" > reports/stock-structure.txt
          cat reports/stock-structure.txt
      - name: Сохранить только отчёт
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stock-structure.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: inspect stock structure and signatures'
          for try in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
