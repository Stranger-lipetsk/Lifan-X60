name: Исследование входов в USB-сетевую отладку
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/inspect-usb-debug-callers.yml'
      - 'tools/inspect_usb_debug_callers.py'
      - 'tests/test_inspect_usb_debug_callers.py'
      - 'tools/inspect_systemui_network_adb.py'
      - 'tests/test_inspect_systemui_network_adb.py'
      - 'tools/inspect_su_static.py'
      - 'tests/test_inspect_su_static.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить анализаторы
        run: |
          python3 -m unittest discover -s tests -p 'test_inspect_usb_debug_callers.py' -v
          python3 -m unittest discover -s tests -p 'test_inspect_systemui_network_adb.py' -v
          python3 -m unittest discover -s tests -p 'test_inspect_su_static.py' -v
      - name: Проверить исходный образ без запуска программ прошивки
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs unzip binutils-arm-linux-gnueabihf
          w="$RUNNER_TEMP/usb-callers"
          mkdir -p "$w/root" reports
          gh release download file-manager-test-20261105 -p lifan-file-manager-test.zip -D "$w"
          echo "4be81211994221e80e401ce712ce484b5320156902fff3707737b73e3945d17f  $w/lifan-file-manager-test.zip" | sha256sum -c -
          unzip -p "$w/lifan-file-manager-test.zip" system.img > "$w/system.img"
          echo "a660f062716fd42d5a6185faec059f42675b3024304de7b81fac5d705cc88511  $w/system.img" | sha256sum -c -
          # debugfs opens the image read-only; its extracted files remain temporary.
          debugfs -R "rdump / $w/root" "$w/system.img" > "$w/rdump.log" 2>&1
          test -s "$w/root/bin/el_debug_tool"
          python3 tools/inspect_usb_debug_callers.py "$w/root" > reports/usb-debug-callers-static.txt
          echo >> reports/usb-debug-callers-static.txt
          echo '## Potential extraction diagnostics' >> reports/usb-debug-callers-static.txt
          grep -iE 'error|fail|not found|no such file|permission denied' "$w/rdump.log" >> reports/usb-debug-callers-static.txt || true
          # APKTool decodes DEX only; the device APK is not executed.
          test -s "$w/root/priv-app/SystemUI.apk"
          sha256sum "$w/root/priv-app/SystemUI.apk"
          curl -fLsS --retry 3 --max-time 120 -o "$w/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          java -jar "$w/apktool.jar" d -f -r "$w/root/priv-app/SystemUI.apk" -o "$w/systemui" >/dev/null
          python3 tools/inspect_systemui_network_adb.py "$w/systemui" > reports/systemui-network-adb-static.txt
          test -s "$w/root/xbin/su"
          debugfs -R 'stat /xbin/su' "$w/system.img" > reports/su-static.txt 2>&1
          python3 tools/inspect_su_static.py "$w/root/xbin/su" >> reports/su-static.txt
      - name: Сохранить только текстовый отчёт
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/usb-debug-callers-static.txt reports/systemui-network-adb-static.txt reports/su-static.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: search system for USB debug entry points'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
