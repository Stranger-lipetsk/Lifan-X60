name: Разбор оболочки Home

on:
  push:
    paths:
      - 'autoanalysis/probe-home.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl >/dev/null 2>&1 || true
          mkdir -p probes
          SDK=/usr/local/lib/android/sdk
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          echo "BT=$BT" >> "$GITHUB_ENV"
          curl -sSL --retry 3 --max-time 300 -o /tmp/baksmali.jar \
            https://github.com/baksmali/smali/releases/download/v2.5.2/baksmali-2.5.2.jar
          ls -l /tmp/baksmali.jar

      - name: "Скачать прошивку"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl', '-L', '--fail', '--retry', '3', '--max-time', '2500',
                          '-o', '/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          find /tmp/rar -name system.img | head -1

      - name: "Манифест оболочки и mac_permissions"
        run: |
          SYSIMG="$(find /tmp/rar -name system.img | head -1)"
          OUT="${GITHUB_WORKSPACE}/probes/home-manifest.txt"
          {
            echo "# Манифест EL830LF01_Home.apk"
            echo
            debugfs -R "dump /priv-app/EL830LF01_Home.apk /tmp/Home.apk" "$SYSIMG" 2>&1 | tail -2
            "$BT/aapt" dump xmltree /tmp/Home.apk AndroidManifest.xml 2>&1 | grep -iE "E: (activity|service|receiver|provider)|A: android:name|action|category|permission|exported" | head -200
            echo
            echo "## mac_permissions.xml (кто считается платформой)"
            debugfs -R "dump /etc/security/mac_permissions.xml /tmp/mac.xml" "$SYSIMG" 2>&1 | tail -1
            cat /tmp/mac.xml 2>/dev/null | head -60
          } > "$OUT" 2>&1 || true
          wc -l "$OUT"

      - name: "Разбор кода: как включается кнопка MirrorLink"
        run: |
          OUT="${GITHUB_WORKSPACE}/probes/home-mirrorlink-code.txt"
          mkdir -p /tmp/home && cd /tmp/home
          unzip -o -q /tmp/Home.apk
          java -jar /tmp/baksmali.jar d classes.dex -o smali 2>&1 | tail -3
          find smali -name "*Mirror*" | head
          {
            echo "# Как оболочка включает кнопку MirrorLink"
            echo
            echo "## файлы с MirrorLink"
            grep -rl -i "mirrorlink" smali | head -20
            echo
            echo "## все обращения к PACKAGE_MIRRORLINK"
            grep -rn "PACKAGE_MIRRORLINK\|MIRRORLINK_STATE\|enableMirrorLinkIcon" smali | head -30
            echo
            echo "## MirrorLinkReceiver целиком"
            for f in $(grep -rl -i "mirrorlink" smali | grep -i mirror | head -3); do
              echo "--- $f"
              cat "$f"
            done
            echo
            echo "## методы, где вызывается enableMirrorLinkIcon"
            for f in $(grep -rl "enableMirrorLinkIcon" smali); do
              echo "--- $f"
              grep -n -A40 "enableMirrorLinkIcon" "$f" | head -120
            done
          } > "$OUT" 2>&1 || true
          wc -l "$OUT"

      - name: "Коммит отчётов"
        if: always()
        run: |
          ls -l probes/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probes
          if git diff --cached --quiet; then echo "нет изменений"; exit 0; fi
          git commit -m "проба: разбор кода оболочки — условие включения кнопки MirrorLink"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
