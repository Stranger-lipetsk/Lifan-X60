name: Совместимость APK (Navitel / Torque / пакеты)

on:
  push:
    paths:
      - 'autoanalysis/apkprobe.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: "Скачать официальные APK Navitel"
        run: |
          mkdir -p reports/apkprobe
          cd reports/apkprobe
          for v in v11.11.1128 9.13.73; do :; done
          set -x
          curl -sSL --retry 3 --max-time 600 -o navitel-11.11.1128.apk \
            https://download.navitel.ru/Android/Navitel-v11.11.1128-Google-full.apk || echo "FAIL 11"
          curl -sSL --retry 3 --max-time 600 -o navitel-9.13.73.apk \
            https://download.navitel.ru/Android/Navitel-9.13.73-full-armeabi.apk || echo "FAIL 9"
          ls -lh
      - name: "Разбор манифестов (свой AXML-парсер)"
        run: |
          python3 tools/axml.py reports/apkprobe/*.apk 2>&1 | tee reports/apkprobe/манифесты.txt
      - name: "Также разобрать стоковый Navitel из прошивки"
        run: |
          python3 - <<'PY' 2>&1 | tee -a reports/apkprobe/манифесты.txt
          import json, os, subprocess, urllib.parse, urllib.request, sys
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type']=='file' and '2016' in i['name']][0]
          os.makedirs('/tmp/fw', exist_ok=True)
          dest = '/tmp/fw/fw.rar'
          subprocess.run(['curl','-L','--fail','--retry','3','--max-time','1200','-o',dest,it['file']], check=True)
          subprocess.run(['7z','x','-y','-aos','-o/tmp/fw/out',dest], capture_output=True)
          subprocess.run('debugfs -R "dump /priv-app/Navitel-9.13.73-large.apk /tmp/fw/navitel-stock.apk" /tmp/fw/out/system.img', shell=True, capture_output=True)
          if os.path.exists('/tmp/fw/navitel-stock.apk'):
              print('\n=== СТОКОВЫЙ Navitel из прошивки ===')
              print(subprocess.run(['python3','tools/axml.py','/tmp/fw/navitel-stock.apk'],
                                   capture_output=True, text=True).stdout)
          else:
              print('стоковый Navitel не извлечён')
          PY
      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'firmware/\nreports/unpacked/\nreports/apkprobe/*.apk\n' > .git/info/exclude
          git add -A reports
          if git diff --cached --quiet; then echo "нет изменений"; else
            git commit -m "совместимость: манифесты Navitel 11.11.1128 / 9.13.73 / стокового"
            git push origin HEAD:${{ github.ref_name }}
          fi
