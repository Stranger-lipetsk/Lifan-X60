name: Статический анализ пути обновления
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/inspect-sd-update-control.yml'
      - 'tools/inspect_sd_update_control.py'
      - 'tests/test_inspect_sd_update_control.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Тесты анализатора
        run: python3 -m unittest discover -s tests -p 'test_inspect_sd_update_control.py' -v
      - name: Прочитать исполняемые файлы как данные
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpio binutils-arm-linux-gnueabihf unzip
          mkdir -p "$RUNNER_TEMP/source" reports
          gh release download file-manager-test-20261105 -p lifan-file-manager-test.zip -D "$RUNNER_TEMP/source"
          echo "4be81211994221e80e401ce712ce484b5320156902fff3707737b73e3945d17f  $RUNNER_TEMP/source/lifan-file-manager-test.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/source/lifan-file-manager-test.zip" sd_boot.img > "$RUNNER_TEMP/source/sd_boot.img"
          curl -fLsS --retry 3 --max-time 120 -o "$RUNNER_TEMP/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$aapt"
          python3 tools/inspect_sd_update_control.py "$RUNNER_TEMP/source/sd_boot.img" "$RUNNER_TEMP/apktool.jar" "$aapt" > reports/sd-update-control-static.txt
      - name: Сохранить только текстовый отчёт
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sd-update-control-static.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: trace sd update control code statically'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
