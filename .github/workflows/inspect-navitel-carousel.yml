name: Анализ Navitel 11 и кольца штатного Home
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/inspect-navitel-carousel.yml'
      - 'tools/inspect_navitel_native.py'
      - 'tools/inspect_home_carousel.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Получить проверенный исходный системный образ
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full e2fsprogs binutils
          mkdir -p "$RUNNER_TEMP/fw" "$RUNNER_TEMP/libs" reports
          gh release download stock --pattern x60_2021.7z -D "$RUNNER_TEMP/fw"
          echo "75e7d6cd900fac971b55fec9f59913153bf7a1096bd761f7229c9a1d6d57b540  $RUNNER_TEMP/fw/x60_2021.7z" | sha256sum -c -
          7z e -y "$RUNNER_TEMP/fw/x60_2021.7z" -o"$RUNNER_TEMP/fw/image" system.img >/dev/null
          img="$RUNNER_TEMP/fw/image/system.img"
          echo "b6bbbe529942ffec250cad993ae9cbb808721c27cf2536fb3fb11120130e8545  $img" | sha256sum -c -
          for lib in libandroid.so liblog.so libdl.so libm.so libc.so; do
            debugfs -R "dump /lib/$lib $RUNNER_TEMP/libs/$lib" "$img" >/dev/null 2>&1
            test -s "$RUNNER_TEMP/libs/$lib"
          done
          debugfs -R "dump /priv-app/EL830LF01_Home.apk $RUNNER_TEMP/Home.apk" "$img" >/dev/null 2>&1
          test -s "$RUNNER_TEMP/Home.apk"
          echo "75ee685d5399e4c394146cac593ec2ed4bfbd5f6cc9151f9ae479992c84011a6  $RUNNER_TEMP/Home.apk" | sha256sum -c -
          curl -fLsS --retry 3 --max-time 120 -o "$RUNNER_TEMP/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
      - name: Анализ APK пользователя и зависимостей
        run: |
          set -euo pipefail
          apk=firmware/apks/com.navitel.apk
          echo "96876415d8b4342952558fd30d6e11b0ca9355c802060c0a9740b6cc84fc4e1b  $apk" | sha256sum -c -
          aapt=$(find /usr/local/lib/android/sdk/build-tools -type f -name aapt | sort -V | tail -1)
          apksigner=$(find /usr/local/lib/android/sdk/build-tools -type f -name apksigner | sort -V | tail -1)
          test -x "$aapt" && test -x "$apksigner"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          set +e
          "$apksigner" verify --min-sdk-version 19 --max-sdk-version 19 --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt" 2>&1
          status=$?
          set -e
          {
            echo '# Candidate Navitel inspection; not a device test'
            sha256sum "$apk"
            stat -c 'APK bytes: %s' "$apk"
            echo '## Selected Android manifest badging'
            grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:|launchable-activity:|uses-permission:)' "$RUNNER_TEMP/badging.txt"
            echo '## API 19 V1 signature verification'
            echo "apksigner status: $status"
            cat "$RUNNER_TEMP/signature.txt"
            echo 'Stock Navitel V1 certificate SHA-256: a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc'
            echo '## Native symbols compared with stock dependencies'
            python3 tools/inspect_navitel_native.py "$apk" "$RUNNER_TEMP/libs"
          } > reports/navitel-11-candidate.txt
          cat reports/navitel-11-candidate.txt
      - name: Исследовать кольцевой список штатного Home
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/apktool.jar" d -f -r "$RUNNER_TEMP/Home.apk" -o "$RUNNER_TEMP/home-decoded" >/dev/null
          {
            echo '# Stock Home carousel: static analysis only'
            echo 'Home APK SHA-256: 75ee685d5399e4c394146cac593ec2ed4bfbd5f6cc9151f9ae479992c84011a6'
            python3 tools/inspect_home_carousel.py "$RUNNER_TEMP/home-decoded"
          } > reports/stock-home-carousel.txt
          wc -c reports/stock-home-carousel.txt
      - name: Сохранить отчёты без загрузки artifacts
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/navitel-11-candidate.txt reports/stock-home-carousel.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: inspect Navitel candidate and Home carousel'
          for try in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
