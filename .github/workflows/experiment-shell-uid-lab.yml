name: Лабораторная проверка shared UID
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/experiment-shell-uid-lab.yml'
      - 'tools/experiment_shell_uid_lab.sh'
      - 'tests/test_shell_uid_lab.py'
      - 'tests/fixtures/shell-uid-lab/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить безопасные ограничения fixture
        run: |
          bash -n tools/experiment_shell_uid_lab.sh
          python3 -m unittest discover -s tests -p 'test_shell_uid_lab.py' -v
      - name: Только виртуальный Android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/experiment_shell_uid_lab.sh
      - name: Статически проверить подпись штатного Shell.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/shell-stock-static"
          mkdir -p "$w"
          gh release download file-manager-test-20261105 -p lifan-file-manager-test.zip -D "$w"
          echo "4be81211994221e80e401ce712ce484b5320156902fff3707737b73e3945d17f  $w/lifan-file-manager-test.zip" | sha256sum -c -
          unzip -p "$w/lifan-file-manager-test.zip" system.img > "$w/system.img"
          echo "a660f062716fd42d5a6185faec059f42675b3024304de7b81fac5d705cc88511  $w/system.img" | sha256sum -c -
          debugfs -R "dump /priv-app/Shell.apk $w/Shell.apk" "$w/system.img" >/dev/null 2>&1
          test -s "$w/Shell.apk"
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$bt/apksigner" verify --min-sdk-version 19 --max-sdk-version 19 --print-certs "$w/Shell.apk" > "$w/cert.txt"
          "$bt/aapt" dump xmltree "$w/Shell.apk" AndroidManifest.xml > "$w/manifest.txt"
          {
            echo; echo '## Stock-derived Shell.apk static check, no firmware execution'
            sha256sum "$w/Shell.apk" | sed "s|$w/||"
            cat "$w/cert.txt"
            grep -F 'android.uid.shell' "$w/manifest.txt"
            echo 'Compare certificate with stock framework-res SHA-256 7fbae817b7db24642d8959c347b561c003c6cfde2cb10f909c932f21a4d6d804.'
            echo 'Certificate similarity does not prove installation, runtime UID, su access, or safety on the real head unit.'
          } >> reports/shell-uid-lab.txt
      - name: Сохранить диагностику при ошибке
        if: failure()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/shell-uid-lab.log" || exit 0
          mkdir -p reports
          tr -d '\r' < "$RUNNER_TEMP/shell-uid-lab.log" > reports/shell-uid-lab-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/shell-uid-lab-error.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: diagnose disposable UID fixture'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Сохранить только текстовый отчёт
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/shell-uid-lab.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: isolated shell shared UID investigation'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
