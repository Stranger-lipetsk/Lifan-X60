name: Разбор нажатия кнопок

on:
  push:
    paths:
      - 'autoanalysis/probe-click.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl >/dev/null 2>&1 || true
          mkdir -p probes
          curl -sSL --retry 3 --max-time 300 -o /tmp/baksmali.jar \
            https://github.com/baksmali/smali/releases/download/v2.5.2/baksmali-2.5.2.jar

      - name: "Скачать и распаковать оболочку"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl', '-L', '--fail', '--retry', '3', '--max-time', '2500',
                          '-o', '/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          SYSIMG="$(find /tmp/rar -name system.img | head -1)"
          debugfs -R "dump /priv-app/EL830LF01_Home.apk /tmp/Home.apk" "$SYSIMG" 2>&1 | tail -1
          mkdir -p /tmp/home && cd /tmp/home && unzip -o -q /tmp/Home.apk
          java -jar /tmp/baksmali.jar d classes.dex -o smali 2>&1 | tail -2
          echo "готово: $(find smali -name '*.smali' | wc -l) файлов"

      - name: "Откуда берётся список приложений (mEleadApps)"
        run: |
          OUT="${GITHUB_WORKSPACE}/probes/home5-list.txt"
          cd /tmp/home
          {
            echo "# Список приложений главного экрана: как формируется"
            echo
            echo "== конструктор/init HomeApp (строки 560-700) =="
            sed -n '560,700p' smali/tw/com/elead/el830/home/HomeApp.smali
            echo
            echo "== где заполняется mEleadApps/add =="
            grep -n "mEleadApps\|invoke-virtual {v[0-9]*, v[0-9]*}, Ljava/util/ArrayList;->add" \
              smali/tw/com/elead/el830/home/HomeApp.smali | head -40
            echo
            echo "== методы HomeApp с add (контекст 20 строк) =="
            grep -n "Ljava/util/ArrayList;->add" smali/tw/com/elead/el830/home/HomeApp.smali | head -10
          } > "$OUT" 2>&1 || true
          wc -l "$OUT"

      - name: "Обработчик нажатия кнопки"
        run: |
          OUT="${GITHUB_WORKSPACE}/probes/home5-click.txt"
          cd /tmp/home
          {
            echo "# Что происходит при нажатии кнопки на главном экране"
            echo
            echo "== main_btn_mirrorlink / обработчики кнопок в Home.smali =="
            grep -n "main_btn_\|onClick\|MSG_GOTO_APPLICATION\|gotoApplication" \
              smali/tw/com/elead/el830/home/Home*.smali | head -40
            echo
            echo "== MSG_GOTO_APPLICATION в HomeService =="
            grep -n "MSG_GOTO_APPLICATION" smali/tw/com/elead/el830/home/*.smali | head
            echo
            echo "== фрагмент обработки MSG_GOTO_APPLICATION =="
            L=$(grep -n "MSG_GOTO_APPLICATION" smali/tw/com/elead/el830/home/HomeService.smali | head -1 | cut -d: -f1)
            if [ -n "$L" ]; then sed -n "$((L-10)),$((L+120))p" smali/tw/com/elead/el830/home/HomeService.smali; fi
            echo
            echo "== кто вызывает startNewActivity =="
            grep -rn "startNewActivity" smali | head
          } > "$OUT" 2>&1 || true
          wc -l "$OUT"

      - name: "Коммит отчётов"
        if: always()
        run: |
          ls -l probes/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probes
          if git diff --cached --quiet; then echo "нет изменений"; exit 0; fi
          git commit -m "проба: список приложений экрана и обработчик нажатия"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
