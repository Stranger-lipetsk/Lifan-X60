name: Выбор модели и ветка по умолчанию

on:
  push:
    paths:
      - 'autoanalysis/probe-model.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl >/dev/null 2>&1 || true
          mkdir -p probes
          curl -sSL --retry 3 --max-time 300 -o /tmp/baksmali.jar \
            https://github.com/baksmali/smali/releases/download/v2.5.2/baksmali-2.5.2.jar
      - name: "Скачать и распаковать"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl', '-L', '--fail', '--retry', '3', '--max-time', '2500',
                          '-o', '/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          SYSIMG="$(find /tmp/rar -name system.img | head -1)"
          debugfs -R "dump /priv-app/EL830LF01_Home.apk /tmp/Home.apk" "$SYSIMG" 2>&1 | tail -1
          mkdir -p /tmp/home && cd /tmp/home && unzip -o -q /tmp/Home.apk
          java -jar /tmp/baksmali.jar d classes.dex -o smali 2>&1 | tail -2
      - name: "Разбор"
        run: |
          OUT="${GITHUB_WORKSPACE}/probes/model-branch.txt"
          cd /tmp/home
          {
            echo "# 1. Как выбирается initDefault (модель устройства)"
            echo
            echo "## HomeApp.smali 7760-7950"
            sed -n '7760,7950p' smali/tw/com/elead/el830/home/HomeApp.smali
            echo
            echo "# 2. Ветка по умолчанию в loadEleadApplications"
            echo "## :cond_23e и то, что после него (хвост метода)"
            awk '/^\.method private loadEleadApplications/,/^\.end method/' \
              smali/tw/com/elead/el830/home/HomeApp.smali > /tmp/load.txt
            grep -n ":cond_23e" /tmp/load.txt | tail -5
            L=$(grep -n "^    :cond_23e" /tmp/load.txt | tail -1 | cut -d: -f1)
            echo "строка :cond_23e -> $L"
            if [ -n "$L" ]; then sed -n "$((L-40)),$((L+120))p" /tmp/load.txt; fi
          } > "$OUT" 2>&1 || true
          wc -l "$OUT"
      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probes
          git diff --cached --quiet && exit 0
          git commit -m "проба: выбор модели и ветка по умолчанию"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
