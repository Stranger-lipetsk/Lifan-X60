name: Build OBD Bluetooth Bridge

on:
  push:
    paths:
      - 'bt-bridge/**'
      - 'bt-diagnostics/**'
      - '.github/workflows/build-bt-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform and build tools
        run: |
          export ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses >/dev/null 2>&1 || true
          sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'build-tools;34.0.0' 'platforms;android-34'

      - name: Compile and verify API 19 APKs
        run: |
          export ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          bash bt-bridge/build.sh
          bash bt-diagnostics/build.sh

      - name: Publish the small installable APKs to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp bt-bridge/build/obd-bt-bridge.apk bt-bridge/obd-bt-bridge.apk
          sha256sum bt-bridge/obd-bt-bridge.apk | awk '{print $1 "  obd-bt-bridge.apk"}' > bt-bridge/obd-bt-bridge.apk.sha256
          cp bt-diagnostics/build/wifi-radio-check.apk bt-diagnostics/wifi-radio-check.apk
          sha256sum bt-diagnostics/wifi-radio-check.apk | awk '{print $1 "  wifi-radio-check.apk"}' > bt-diagnostics/wifi-radio-check.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- bt-bridge/obd-bt-bridge.apk bt-bridge/obd-bt-bridge.apk.sha256 bt-diagnostics/wifi-radio-check.apk bt-diagnostics/wifi-radio-check.apk.sha256
          if git diff --cached --quiet; then
            echo 'Installable APK is already current.'
            exit 0
          fi
          git commit -m 'build: publish OBD bridge and Wi-Fi diagnostics APKs'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" >/dev/null 2>&1 && \
               git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 10
            git rebase --abort >/dev/null 2>&1 || true
          done
          echo 'Unable to publish the installable APK on the triggering branch.' >&2
          exit 1
