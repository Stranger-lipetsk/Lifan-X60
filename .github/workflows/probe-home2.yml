name: Разбор оболочки Home 2

on:
  push:
    paths:
      - 'autoanalysis/probe-home2.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl >/dev/null 2>&1 || true
          mkdir -p probes
          curl -sSL --retry 3 --max-time 300 -o /tmp/baksmali.jar \
            https://github.com/baksmali/smali/releases/download/v2.5.2/baksmali-2.5.2.jar
          ls -l /tmp/baksmali.jar

      - name: "Скачать прошивку"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl', '-L', '--fail', '--retry', '3', '--max-time', '2500',
                          '-o', '/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          SYSIMG="$(find /tmp/rar -name system.img | head -1)"
          debugfs -R "dump /priv-app/EL830LF01_Home.apk /tmp/Home.apk" "$SYSIMG" 2>&1 | tail -1
          mkdir -p /tmp/home && cd /tmp/home && unzip -o -q /tmp/Home.apk
          java -jar /tmp/baksmali.jar d classes.dex -o smali 2>&1 | tail -2

      - name: "Условие включения кнопки"
        run: |
          OUT="${GITHUB_WORKSPACE}/probes/home2-condition.txt"
          cd /tmp/home
          {
            echo "# Как оболочка решает, включать ли кнопку MirrorLink"
            echo
            echo "== 1. HomeApp.enableEleadApplication =="
            awk '/^\.method.*enableEleadApplication/,/^\.end method/' smali/tw/com/elead/el830/home/HomeApp.smali
            echo
            echo "== 2. HomeApp.isPackageInstalled / проверки установки =="
            awk '/^\.method.*(isInstall|isAppInstall|checkApp|enableElead|loadElead)/,/^\.end method/' smali/tw/com/elead/el830/home/HomeApp.smali | head -200
            echo
            echo "== 3. Кто вызывает access\$10500(...,true) =="
            grep -rn -B6 "access\$10500" smali | grep -E "const/4 v[0-9]+, 0x1|access\\\$10500|^--" | head -60
            echo
            echo "== 4. Все строки vn.com.fsoft и com.fpt =="
            grep -rhn "const-string.*\"\(vn\.com\.fsoft\|com\.fpt\|com\.elead\)" smali | sort -u | head -40
            echo
            echo "== 5. Home\$5: обработка MSG_UPDATE_MIRRORLINK_STATE =="
            awk '/const\/16 0x3f3|0x3f3/,0' smali/tw/com/elead/el830/home/Home\$5.smali 2>/dev/null | head -80
            echo
            echo "== 6. Определение access\$10500 =="
            awk '/^\.method.*access\$10500/,/^\.end method/' smali/tw/com/elead/el830/home/HomeService.smali
            echo
            echo "== 7. Где вообще вызывается sendBroadcast с этими action =="
            grep -rn "UsbIfaceDown\|getscreenoff\|mirrorlink" smali | head -20
          } > "$OUT" 2>&1 || true
          wc -l "$OUT"

      - name: "Коммит отчёта"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probes
          if git diff --cached --quiet; then echo "нет изменений"; exit 0; fi
          git commit -m "проба: условие включения кнопки MirrorLink"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
