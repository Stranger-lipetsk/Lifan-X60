name: Разбор gotoEleadApplication

on:
  push:
    paths:
      - 'autoanalysis/probe-goto2.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl >/dev/null 2>&1 || true
          mkdir -p probes
          curl -sSL --retry 3 --max-time 300 -o /tmp/baksmali.jar \
            https://github.com/baksmali/smali/releases/download/v2.5.2/baksmali-2.5.2.jar

      - name: "Скачать и распаковать"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl', '-L', '--fail', '--retry', '3', '--max-time', '2500',
                          '-o', '/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          SYSIMG="$(find /tmp/rar -name system.img | head -1)"
          debugfs -R "dump /priv-app/EL830LF01_Home.apk /tmp/Home.apk" "$SYSIMG" 2>&1 | tail -1
          mkdir -p /tmp/home && cd /tmp/home && unzip -o -q /tmp/Home.apk
          java -jar /tmp/baksmali.jar d classes.dex -o smali 2>&1 | tail -2

      - name: "gotoEleadApplication — запуск интента"
        run: |
          OUT="${GITHUB_WORKSPACE}/probes/home9-goto.txt"
          cd /tmp/home
          {
            echo "# gotoEleadApplication: как реально стартует приложение"
            echo
            awk '/^\.method.*gotoEleadApplication/,/^\.end method/' smali/tw/com/elead/el830/home/HomeApp.smali
            echo
            echo "== getEleadApplication =="
            awk '/^\.method.*getEleadApplication/,/^\.end method/' smali/tw/com/elead/el830/home/HomeApp.smali
            echo
            echo "== NaviIsExist и enableNaviIcon (как включается кнопка навигатора) =="
            awk '/^\.method.*NaviIsExist/,/^\.end method/' smali/tw/com/elead/el830/home/HomeService.smali
            awk '/^\.method.*enableNaviIcon/,/^\.end method/' smali/tw/com/elead/el830/home/HomeService.smali
            echo
            echo "== как запускается навигатор (com.navitel) =="
            grep -rn "com.navitel" smali/tw/com/elead/el830/home/*.smali | head -20
            echo
            echo "== findMainActivityForPackage =="
            awk '/^\.method private findMainActivityForPackage/,/^\.end method/' smali/tw/com/elead/el830/home/HomeApp.smali
          } > "$OUT" 2>&1 || true
          wc -l "$OUT"

      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probes
          if git diff --cached --quiet; then echo "нет изменений"; exit 0; fi
          git commit -m "проба: gotoEleadApplication и запуск навигатора"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
