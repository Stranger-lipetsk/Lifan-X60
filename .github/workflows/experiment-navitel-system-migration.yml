name: Лабораторная миграция Navitel на Android 4.4 ARM
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/experiment-navitel-system-migration.yml'
      - 'tools/experiment_navitel_system_migration.sh'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить синтаксис стенда
        run: bash -n tools/experiment_navitel_system_migration.sh
      - name: Проверить перенос фиктивного маркера на эмуляторе
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/experiment_navitel_system_migration.sh
      - name: Сохранить инфраструктурную диагностику
        if: failure()
        run: |
          set -e
          test -s "$RUNNER_TEMP/navitel-migration.log" || exit 0
          mkdir -p reports
          tr -d '\r' < "$RUNNER_TEMP/navitel-migration.log" > reports/navitel-system-migration-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/navitel-system-migration-error.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: diagnose navitel migration emulator'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Сохранить только текстовый отчёт
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/navitel-system-migration-emulator.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: navitel system migration emulator test'
          for try in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
