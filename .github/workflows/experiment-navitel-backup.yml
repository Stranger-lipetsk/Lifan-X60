name: Лабораторная проверка Android backup Navitel
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/experiment-navitel-backup.yml'
      - 'tools/experiment_navitel_backup.sh'
      - 'tools/check_synthetic_adb_backup.py'
      - 'tools/emulator_backup_confirmation.py'
      - 'tests/test_check_synthetic_adb_backup.py'
      - 'tests/test_emulator_backup_confirmation.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить синтаксис и тесты помощников
        run: |
          bash -n tools/experiment_navitel_backup.sh
          python3 -m unittest discover -s tests -p 'test_check_synthetic_adb_backup.py' -v
          python3 -m unittest discover -s tests -p 'test_emulator_backup_confirmation.py' -v
      - name: Резервирование только фиктивного маркера в одноразовом эмуляторе
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/experiment_navitel_backup.sh
      - name: Сохранить диагностику при ошибке
        if: failure()
        run: |
          set -e
          test -s "$RUNNER_TEMP/navitel-backup-test.log" || exit 0
          mkdir -p reports
          tr -d '\r' < "$RUNNER_TEMP/navitel-backup-test.log" > reports/navitel-backup-restore-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/navitel-backup-restore-error.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: diagnose synthetic Navitel backup test'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Сохранить только текстовый отчёт без архивов
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/navitel-backup-restore-emulator.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: synthetic Navitel backup and restore test'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
