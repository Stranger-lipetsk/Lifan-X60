name: Раскладка главного экрана

on:
  push:
    paths:
      - 'autoanalysis/probe-layout.txt'
  workflow_dispatch:

permissions: { contents: write }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unzip curl >/dev/null 2>&1 || true
          curl -sSL --retry 3 --max-time 300 -o /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          mkdir -p docs/mockup probes
      - name: "Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: "Распаковать оболочку"
        run: |
          mkdir -p /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type'] == 'file' and '2016' in i['name']][0]
          subprocess.run(['curl','-L','--fail','--retry','3','--max-time','2500',
                          '-o','/tmp/fw.rar', it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          SYSIMG="$(find /tmp/rar -name system.img | head -1)"
          debugfs -R "dump /priv-app/EL830LF01_Home.apk /tmp/Home.apk" "$SYSIMG" 2>&1 | tail -1
          java -jar /tmp/apktool.jar d -f /tmp/Home.apk -o /tmp/HomeDec 2>&1 | tail -2
      - name: "Найти layout главного экрана"
        run: |
          OUT="$GITHUB_WORKSPACE/probes/home-layout.txt"
          {
            echo "# Раскладка главного экрана"
            echo
            echo "## какие layout есть"
            ls /tmp/HomeDec/res/layout* 2>/dev/null | head -40
            echo
            echo "## setContentView в коде"
            grep -rn "setContentView" /tmp/HomeDec/smali*/ 2>/dev/null | head -20
            echo
            echo "## имена drawable кнопок"
            find /tmp/HomeDec/res -iname "*navi*" -o -iname "*mirror*" -o -iname "*radio*" -o -iname "*music*" 2>/dev/null | head -30
          } > "$OUT" 2>&1
          cat "$OUT"

      - name: "Вытащить картинки"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/docs/mockup"
          # фон и иконки главного экрана
          for pat in main_bg background_home home_bg ic_launcher; do
            find /tmp/HomeDec/res -iname "*$pat*" -name "*.png" 2>/dev/null | head -3
          done | head -6 | while read f; do
            cp "$f" "$GITHUB_WORKSPACE/docs/mockup/" 2>/dev/null
          done
          ls -l "$GITHUB_WORKSPACE/docs/mockup/" | head -20

      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probes docs/mockup
          git diff --cached --quiet && exit 0
          git commit -m "проба: раскладка главного экрана"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep 10; git rebase --abort >/dev/null 2>&1 || true
          done
