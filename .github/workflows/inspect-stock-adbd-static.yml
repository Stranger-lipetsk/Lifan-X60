name: Статика штатного adbd
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths: ['.github/workflows/inspect-stock-adbd-static.yml', 'tools/inspect_stock_adbd_static.py', 'tools/inspect_init_property_table.py', 'tests/test_inspect_init_property_table.py', 'tools/inspect_stock_adb_selinux.py', 'reports/deep2/update/sepolicy', 'reports/stock-adb-selinux-static.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Проверить анализатор таблицы
        run: python3 -m unittest discover -s tests -p 'test_inspect_init_property_table.py' -v
      - name: Прочитать проверенный boot.img без исполнения
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpio binutils
          w="$RUNNER_TEMP/adbd-static"
          mkdir -p "$w" reports
          gh release download file-manager-test-20261105 -p lifan-file-manager-test.zip -D "$w"
          echo "4be81211994221e80e401ce712ce484b5320156902fff3707737b73e3945d17f  $w/lifan-file-manager-test.zip" | sha256sum -c -
          unzip -p "$w/lifan-file-manager-test.zip" boot.img > "$w/boot.img"
          python3 tools/inspect_stock_adbd_static.py "$w/boot.img" > reports/stock-adbd-static.txt
      - name: Проверить SELinux-права свойства ADB
        id: selinux
        continue-on-error: true
        run: |
          set +e
          { sudo apt-get update -qq && sudo apt-get install -y setools python3-setools && python3 tools/inspect_stock_adb_selinux.py; } > reports/stock-adb-selinux-static.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> reports/stock-adb-selinux-static.txt
          cat reports/stock-adb-selinux-static.txt
          exit "$rc"
      - name: Сохранить текстовый отчёт
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stock-adbd-static.txt
          test ! -f reports/stock-adb-selinux-static.txt || git add reports/stock-adb-selinux-static.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: stock-derived adbd static inspection'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
