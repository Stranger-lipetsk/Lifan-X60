name: Глубокий разбор Home.apk (MirrorLink)

on:
  push:
    paths:
      - 'autoanalysis/probehomed.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unrar-free e2fsprogs >/dev/null 2>&1 || true
      - name: "Скачать прошивку"
        run: |
          mkdir -p out /tmp/rar
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type']=='file' and '2016' in i['name']][0]
          subprocess.run(['curl','-L','--fail','--retry','3','--max-time','2500',
                          '-o','/tmp/fw.rar',it['file']], check=True)
          PY
          7z x -y -aos -o/tmp/rar /tmp/fw.rar >/dev/null 2>&1 || true
          cp "$(find /tmp/rar -name system.img | head -1)" out/system.img
      - name: "Разбор"
        run: |
          debugfs -R "dump /priv-app/EL830LF01_Home.apk /tmp/Home.apk" out/system.img 2>/dev/null
          python3 tools/probe_home_deep.py /tmp/Home.apk 2>&1 | head -200
      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'firmware/\nout/\n' > .git/info/exclude
          git add -A reports
          if git diff --cached --quiet; then echo "нет изменений"; else
            git commit -m "глубокий разбор Home.apk: как запускается MirrorLink"
            git push origin HEAD:${{ github.ref_name }}
          fi
