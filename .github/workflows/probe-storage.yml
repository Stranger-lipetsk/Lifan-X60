name: Проба накопителей и Navitel

on:
  push:
    paths:
      - 'autoanalysis/probe.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unrar-free e2fsprogs >/dev/null 2>&1 || true
      - name: "Скачать прошивку"
        run: |
          mkdir -p firmware/original
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request
          pk = 'https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg'
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type']=='file' and '2016' in i['name']][0]
          dest = 'firmware/original/firmware.rar'
          subprocess.run(['curl','-L','--fail','--retry','3','--max-time','2500','-o',dest,it['file']], check=True)
          print('OK', os.path.getsize(dest))
          PY
      - name: "Распаковать system.img"
        run: |
          mkdir -p out reports
          mkdir -p /tmp/rar
          7z x -y -aos -o/tmp/rar firmware/original/firmware.rar >/dev/null 2>&1 || true
          SRC=$(find /tmp/rar -name system.img | head -1)
          cp "$SRC" out/system-original.img
          ls -l out/
      - name: "Проба"
        run: python3 tools/probe_storage.py out/system-original.img reports 2>&1 | tail -100
      - name: "Аудит локали (обновлённый)"
        run: |
          mkdir -p /tmp/root
          debugfs -R "rdump / \"/tmp/root\"" out/system-original.img >/dev/null 2>&1 || true
          rm -rf /tmp/root/lost+found
          python3 tools/audit_system.py /tmp/root 2>&1 | head -60
      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'firmware/\nout/\n' > .git/info/exclude
          git add -A reports
          if git diff --cached --quiet; then echo "нет изменений"; exit 0; fi
          git commit -m "проба: накопители, пути Navitel, локали, доступные сборки"
          for try in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin HEAD:${{ github.ref_name }}; then
              echo "отчёты отправлены (попытка $try)"; exit 0
            fi
            echo "попытка $try не удалась, повтор через 10 с"; sleep 10
            git rebase --abort >/dev/null 2>&1 || true
          done
          echo "не удалось отправить отчёты — не критично, образ собран"
