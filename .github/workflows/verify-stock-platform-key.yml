name: Проверка совместимости штатной подписи Home
on:
  push:
    branches: [arena/b12cc9a8-lifan-x60]
    paths:
      - '.github/workflows/verify-stock-platform-key.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref_name == 'arena/b12cc9a8-lifan-x60'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить исходный APK и публичный тестовый ключ Freescale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full e2fsprogs
          mkdir -p "$RUNNER_TEMP/stock" reports
          gh release download stock -p x60_2021.7z -D "$RUNNER_TEMP/stock"
          echo "75e7d6cd900fac971b55fec9f59913153bf7a1096bd761f7229c9a1d6d57b540  $RUNNER_TEMP/stock/x60_2021.7z" | sha256sum -c -
          7z e -y "$RUNNER_TEMP/stock/x60_2021.7z" -o"$RUNNER_TEMP/stock/image" system.img >/dev/null
          img="$RUNNER_TEMP/stock/image/system.img"
          echo "b6bbbe529942ffec250cad993ae9cbb808721c27cf2536fb3fb11120130e8545  $img" | sha256sum -c -
          debugfs -R "dump /priv-app/EL830LF01_Home.apk $RUNNER_TEMP/Home.apk" "$img" >/dev/null 2>&1
          echo "75ee685d5399e4c394146cac593ec2ed4bfbd5f6cc9151f9ae479992c84011a6  $RUNNER_TEMP/Home.apk" | sha256sum -c -
          repo=Avnet/android-imx-device-fsl
          ref=495a2e2f50ecbd6d97922aeaf0224a90d1ed6d94
          for name in platform.x509.pem platform.pk8; do
            gh api "repos/$repo/contents/common/security/$name?ref=$ref" --jq .content | base64 -d > "$RUNNER_TEMP/$name"
            test -s "$RUNNER_TEMP/$name"
          done
          # The public development key remains in the ephemeral runner, not the repository.
          cert_sha=$(openssl x509 -in "$RUNNER_TEMP/platform.x509.pem" -outform DER | sha256sum | cut -d' ' -f1)
          pub_sha=$(openssl pkey -inform DER -in "$RUNNER_TEMP/platform.pk8" -pubout -outform DER | sha256sum | cut -d' ' -f1)
          test "$cert_sha" = 7fbae817b7db24642d8959c347b561c003c6cfde2cb10f909c932f21a4d6d804
          test "$pub_sha" = 3510803bae3da5f072e443c590c9c97b992f428ed7a3c79802071364ad9d8d5c
          sdk=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          bt=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$bt/apksigner" sign --key "$RUNNER_TEMP/platform.pk8" --cert "$RUNNER_TEMP/platform.x509.pem" \
            --min-sdk-version 19 --v1-signing-enabled true --out "$RUNNER_TEMP/Home-resigned.apk" "$RUNNER_TEMP/Home.apk"
          "$bt/apksigner" verify --min-sdk-version 19 --max-sdk-version 19 --verbose --print-certs "$RUNNER_TEMP/Home-resigned.apk" > "$RUNNER_TEMP/verify.txt" 2>&1
          grep -F 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/verify.txt"
          grep -F "certificate SHA-256 digest: $cert_sha" "$RUNNER_TEMP/verify.txt"
          python3 - "$RUNNER_TEMP/Home.apk" "$RUNNER_TEMP/Home-resigned.apk" > "$RUNNER_TEMP/compare.txt" <<'PY'
          import hashlib, sys, zipfile
          def items(path):
              with zipfile.ZipFile(path) as z:
                  names = [n for n in z.namelist() if not n.upper().startswith('META-INF/') and not n.endswith('/')]
                  if len(names) != len(set(names)): raise SystemExit('Duplicate ZIP entries')
                  return {n: hashlib.sha256(z.read(n)).hexdigest() for n in names}
          orig, signed = items(sys.argv[1]), items(sys.argv[2])
          if orig != signed: raise SystemExit('Original APK payload changed during signature test')
          print('Unchanged non-META-INF entries:', len(orig))
          print('classes.dex sha256:', orig['classes.dex'])
          print('AndroidManifest.xml sha256:', orig['AndroidManifest.xml'])
          PY
          {
            echo '# Stock Home platform certificate and signing feasibility, offline only'
            echo 'Original Home SHA-256 75ee685d5399e4c394146cac593ec2ed4bfbd5f6cc9151f9ae479992c84011a6'
            echo 'Freescale development certificate source: Avnet/android-imx-device-fsl commit 495a2e2f50ecbd6d97922aeaf0224a90d1ed6d94, common/security'
            echo 'Public development key is available; its public key matches the Home certificate.'
            echo 'This is a signing test of an unchanged copy, not a firmware or device test.'
            cat "$RUNNER_TEMP/compare.txt"
            cat "$RUNNER_TEMP/verify.txt"
          } > reports/stock-home-signing-feasibility.txt
      - name: Сохранить только текстовый отчёт
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stock-home-signing-feasibility.txt
          git diff --cached --quiet && exit 0
          git commit -m 'report: verify matching stock home test signature'
          for try in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
