name: Разбор прошивки — проход 3

on:
  push:
    paths:
      - 'autoanalysis/pass3.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  PUBLIC_KEY: https://disk.yandex.ru/d/qJdjjeB8Aiq3Lg

jobs:
  pass3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: "Инструменты"
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq p7zip-full unrar-free file >/dev/null 2>&1 || true
      - name: "Скачать и распаковать"
        run: |
          mkdir -p firmware/original reports/unpacked
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request
          pk = os.environ['PUBLIC_KEY']
          url = ('https://cloud-api.yandex.net/v1/disk/public/resources'
                 '?public_key=' + urllib.parse.quote(pk, safe='') + '&limit=100')
          items = json.load(urllib.request.urlopen(url, timeout=60))['_embedded']['items']
          it = [i for i in items if i['type']=='file' and '2016' in i['name']][0]
          dest = os.path.join('firmware/original', it['name'])
          subprocess.run(['curl','-L','--fail','--retry','3','--connect-timeout','30',
                          '--max-time','2500','-o',dest,it['file']], check=True)
          print('OK', os.path.getsize(dest))
          PY
          for f in firmware/original/*; do
            [ -f "$f" ] || continue
            7z x -y -aos -o"reports/unpacked" "$f" >/dev/null 2>&1 || true
          done
          ls -la reports/unpacked
      - name: "Проход 3"
        run: python3 tools/fw_pass3.py reports/unpacked reports/pass3 2>&1 | tail -200
      - name: "APK: манифесты через aapt (если есть)"
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq aapt >/dev/null 2>&1 || true
          SYS=$(find reports/unpacked -name system.img | head -1)
          mkdir -p reports/pass3/x
          echo "aapt: $(command -v aapt || echo нет)"
      - name: "Коммит"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'firmware/\nreports/unpacked/\n' > .git/info/exclude
          git add -A reports
          if git diff --cached --quiet; then echo "нет изменений"; else
            git commit -m "разбор прошивки: проход 3 (разметка, APK, конфиги)"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass3-reports
          path: reports/pass3
          retention-days: 7
